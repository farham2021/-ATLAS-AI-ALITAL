name: ATLAS AI v10.2 FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: read

concurrency:
  group: atlas-ai
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ============================================================
      # 1. VALIDATE FILES WITH FULL DEBUG OUTPUT
      # ============================================================
      - name: Validate files with debug
        run: |
          set -euo pipefail
          
          echo "=============================================="
          echo "STEP 1: CHECKING FILES"
          echo "=============================================="
          
          echo "Python version:"
          python --version
          echo ""
          
          echo "Files in repository:"
          ls -la *.py 2>/dev/null || echo "No .py files found"
          echo ""
          
          echo "Checking bot.py..."
          test -f bot.py && echo "✅ bot.py found" || { echo "❌ bot.py missing"; exit 1; }
          
          echo "Checking smoke_atlas.py..."
          test -f smoke_atlas.py && echo "✅ smoke_atlas.py found" || { echo "❌ smoke_atlas.py missing"; exit 1; }
          echo ""
          
          echo "=============================================="
          echo "STEP 2: PYTHON SYNTAX CHECK"
          echo "=============================================="
          
          python -m py_compile bot.py && echo "✅ bot.py syntax OK" || { echo "❌ bot.py syntax error"; exit 1; }
          
          if [ -f smoke_atlas.py ]; then
            python -m py_compile smoke_atlas.py && echo "✅ smoke_atlas.py syntax OK" || { echo "❌ smoke_atlas.py syntax error"; exit 1; }
          fi
          echo ""
          
          echo "=============================================="
          echo "STEP 3: RUNNING SMOKE TEST"
          echo "=============================================="
          
          # Run smoke test with full output and capture exit code
          python -u smoke_atlas.py 2>&1
          SMOKE_EXIT=$?
          
          if [ $SMOKE_EXIT -eq 0 ]; then
            echo ""
            echo "✅ Smoke test passed successfully"
          else
            echo ""
            echo "❌ Smoke test failed with exit code: $SMOKE_EXIT"
            echo ""
            echo "=============================================="
            echo "DEBUG: Showing first 20 lines of bot.py"
            echo "=============================================="
            head -n 20 bot.py
            echo ""
            echo "=============================================="
            echo "DEBUG: Checking VERSION in bot.py"
            echo "=============================================="
            grep -n "VERSION" bot.py || echo "VERSION not found"
            exit 1
          fi

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install runtime dependency
        run: |
          echo "=============================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=============================================="
          python -m pip install --upgrade pip
          python -m pip install --upgrade ccxt
          echo "✅ Dependencies installed"

      # ============================================================
      # 3. RUN ATLAS
      # ============================================================
      - name: Run ATLAS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          echo "=============================================="
          echo "RUNNING ATLAS"
          echo "=============================================="
          echo "Python version:"
          python --version
          echo ""
          echo "CCXT version:"
          python -c "import ccxt; print(ccxt.__version__)" 2>/dev/null || echo "CCXT not installed"
          echo ""
          echo "Starting ATLAS..."
          echo "=============================================="
          python -u bot.py
          echo ""
          echo "=============================================="
          echo "ATLAS COMPLETED SUCCESSFULLY"
          echo "=============================================="

      # ============================================================
      # 4. UPLOAD DIAGNOSTICS (ON FAILURE)
      # ============================================================
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-diagnostics-${{ github.run_id }}
          path: |
            atlas_v*.sqlite3
            changelog.txt
            *.log
          if-no-files-found: ignore
          retention-days: 7

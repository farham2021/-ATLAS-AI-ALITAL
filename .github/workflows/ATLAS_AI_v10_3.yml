name: ATLAS AI v10.3 — Global + Personal 4H

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run GLOBAL, PERSONAL or BOTH"
        required: false
        default: "BOTH"
  schedule:
    # Tehran is UTC+03:30 year-round.
    # GLOBAL: 08:00 / 14:00 / 20:00 Tehran => 04:30 / 10:30 / 16:30 UTC
    # PERSONAL: every 4h, offset by 5 minutes => 00:05 / 04:05 / ... Tehran
    - cron: "30 4,10,16 * * *"
    - cron: "35 20,0,4,8,12,16 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-3-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  ATLAS_VERSION: "10.3"
  ATLAS_TIMEFRAME: "4H"
  RISK_PER_TRADE_PCT: "1.5"
  MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
  ATLAS_MIN_CONFIDENCE: "60"
  ATLAS_MAX_LEVERAGE: "10"
  ATLAS_BACKTEST_DAYS: "180"
  ATLAS_SIGNAL_HORIZON_BARS: "36"
  ATLAS_BACKTEST_IMPROVEMENT: "10"
  ATLAS_BACKTEST_REFRESH_HOURS: "24"
  ATLAS_CANDLE_EVENT_DEDUP: "1"
  ATLAS_SQLITE_FILE: "atlas_v103.sqlite3"
  ATLAS_CHANGELOG: "changelog.txt"
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
  CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
  CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

jobs:
  global-market:
    name: ATLAS Global Market — 3x Daily
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 4,10,16 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'GLOBAL' || github.event.inputs.mode == 'BOTH' || github.event.inputs.mode == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATLAS_MODE: GLOBAL
      ATLAS_SQLITE_FILE: "atlas_v103_global.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade ccxt
      - name: Restore global ATLAS state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v103_global.sqlite3
            atlas_v103_global.sqlite3-wal
            atlas_v103_global.sqlite3-shm
            changelog.txt
          key: atlas-v103-global-${{ github.run_id }}
          restore-keys: |
            atlas-v103-global-
      - name: Validate repository and Python
        run: |
          set -euo pipefail
          test -f bot.py
          python -m py_compile bot.py
          test -f atlas_v10_3_smoke_test.py
          python atlas_v10_3_smoke_test.py
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID" || test -n "$TELEGRAM_GROUP_CHAT_ID"
      - name: Run ATLAS GLOBAL
        run: python bot.py
      - name: Save global ATLAS state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v103_global.sqlite3
            atlas_v103_global.sqlite3-wal
            atlas_v103_global.sqlite3-shm
            changelog.txt
          key: atlas-v103-global-${{ github.run_id }}

  personal-portfolio:
    name: ATLAS Personal Portfolio — Every 4H
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '35 20,0,4,8,12,16 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'PERSONAL' || github.event.inputs.mode == 'BOTH' || github.event.inputs.mode == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATLAS_MODE: PERSONAL
      ATLAS_SQLITE_FILE: "atlas_v103_personal.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade ccxt
      - name: Restore personal ATLAS state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v103_personal.sqlite3
            atlas_v103_personal.sqlite3-wal
            atlas_v103_personal.sqlite3-shm
            changelog.txt
          key: atlas-v103-personal-${{ github.run_id }}
          restore-keys: |
            atlas-v103-personal-
      - name: Validate repository and Python
        run: |
          set -euo pipefail
          test -f bot.py
          python -m py_compile bot.py
          test -f atlas_v10_3_smoke_test.py
          python atlas_v10_3_smoke_test.py
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID" || test -n "$TELEGRAM_GROUP_CHAT_ID"
      - name: Run ATLAS PERSONAL 4H
        run: python bot.py
      - name: Save personal ATLAS state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v103_personal.sqlite3
            atlas_v103_personal.sqlite3-wal
            atlas_v103_personal.sqlite3-shm
            changelog.txt
          key: atlas-v103-personal-${{ github.run_id }}

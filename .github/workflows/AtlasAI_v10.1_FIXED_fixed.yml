name: ATLAS v10.1 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # اجرای ATLAS هر 4 ساعت
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  atlas:
    name: ATLAS v10.1 Market Supervisor
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. RESTORE PERSISTENT ATLAS STATE
      # ============================================================
      # SQLite:
      # - backtest cache
      # - signal memory
      # - duplicate-signal protection
      # - candle deduplication
      #
      # Changelog:
      # - persistent execution history
      #
      # IMPORTANT:
      # github.run_number is intentionally NOT used as the only
      # restore key. restore-keys finds the latest previous state.
      # ============================================================
      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v10.sqlite3
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_number }}

          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-${{ runner.os }}-

      # ============================================================
      # 4. INITIALIZE STATE FILES
      # ============================================================
      # First execution may have no cache.
      # Create empty files so the save step always has valid paths.
      # ============================================================
      - name: Initialize ATLAS persistent state
        shell: bash
        run: |
          set -e

          touch changelog.txt

          if [ ! -f atlas_v10.sqlite3 ]; then
            touch atlas_v10.sqlite3
          fi

          echo "===== INITIAL STATE ====="
          ls -lh atlas_v10.sqlite3
          ls -lh changelog.txt

      # ============================================================
      # 5. VERIFY BOT
      # ============================================================
      - name: Verify ATLAS bot
        shell: bash
        run: |
          set -e

          test -f bot.py

          python -m py_compile bot.py

          echo "ATLAS bot.py syntax check: OK"

      # ============================================================
      # 6. RUN ATLAS
      # ============================================================
      - name: Run ATLAS v10.1
        env:

          PYTHONUNBUFFERED: "1"

          # --------------------------------------------------------
          # TELEGRAM
          # --------------------------------------------------------
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          # --------------------------------------------------------
          # SUPABASE
          # --------------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # --------------------------------------------------------
          # MARKET DATA
          # --------------------------------------------------------
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

          # --------------------------------------------------------
          # NEWS
          # --------------------------------------------------------
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

          # --------------------------------------------------------
          # DERIVATIVES / LIQUIDATIONS
          # --------------------------------------------------------
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          # --------------------------------------------------------
          # ATLAS VERSION
          # --------------------------------------------------------
          ATLAS_VERSION: "10.1"
          ATLAS_TIMEFRAME: "4H"

          # --------------------------------------------------------
          # RISK ENGINE
          # --------------------------------------------------------
          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

          # --------------------------------------------------------
          # SIGNAL THRESHOLDS
          # --------------------------------------------------------
          ATLAS_MIN_CONFIDENCE: "60"
          ATLAS_WATCH_CONFIDENCE: "55"
          ATLAS_MAX_LEVERAGE: "10"

          # --------------------------------------------------------
          # BACKTEST ENGINE
          # --------------------------------------------------------
          ATLAS_BACKTEST_DAYS: "180"
          ATLAS_BACKTEST_REFRESH_HOURS: "24"
          ATLAS_SIGNAL_HORIZON_BARS: "36"
          ATLAS_BACKTEST_IMPROVEMENT: "10"

          # --------------------------------------------------------
          # PERSISTENT FILES
          # --------------------------------------------------------
          ATLAS_SQLITE_FILE: "atlas_v10.sqlite3"
          ATLAS_CHANGELOG: "changelog.txt"

        run: |
          set -e

          echo "========================================"
          echo "ATLAS v10.1 START"
          echo "========================================"

          python bot.py

          echo "========================================"
          echo "ATLAS v10.1 FINISHED"
          echo "========================================"

      # ============================================================
      # 7. INSPECT STATE
      # ============================================================
      # Always run this even if bot.py fails.
      # This gives us direct evidence about SQLite/changelog state.
      # ============================================================
      - name: Inspect ATLAS persistent state
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ATLAS PERSISTENT STATE"
          echo "========================================"

          if [ -f atlas_v10.sqlite3 ]; then
            echo "SQLite:"
            ls -lh atlas_v10.sqlite3
          else
            echo "ERROR: atlas_v10.sqlite3 NOT FOUND"
          fi

          echo ""

          if [ -f changelog.txt ]; then
            echo "Changelog:"
            ls -lh changelog.txt
            echo "Lines:"
            wc -l changelog.txt
          else
            echo "ERROR: changelog.txt NOT FOUND"
          fi

      # ============================================================
      # 8. SAVE PERSISTENT STATE
      # ============================================================
      # Only save when ATLAS completed successfully.
      #
      # This prevents a failed/corrupted execution from replacing
      # the last known-good persistent state.
      # ============================================================
      - name: Save ATLAS persistent state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v10.sqlite3
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_number }}

      # ============================================================
      # 9. UPLOAD DEBUG ARTIFACT
      # ============================================================
      # Independent from cache.
      # Gives us a downloadable snapshot of the state of the run.
      # ============================================================
      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-state-${{ github.run_number }}

          path: |
            atlas_v10.sqlite3
            changelog.txt

          if-no-files-found: warn
          retention-days: 7

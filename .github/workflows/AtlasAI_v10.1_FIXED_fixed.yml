name: ATLAS v10.0 Market Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  atlas:
    name: ATLAS v10.0 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout ATLAS repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade ccxt


      # ============================================================
      # 4. RESTORE ATLAS PERSISTENT LOCAL STATE
      #
      # SQLite is a FALLBACK/local audit layer.
      # Supabase remains the PRIMARY persistent state.
      #
      # The cache restores:
      #   - atlas_v10.sqlite3
      #   - changelog.txt
      #
      # IMPORTANT:
      # Do this BEFORE bot.py runs.
      # ============================================================
      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v10.sqlite3
            changelog.txt
          key: atlas-state-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            atlas-state-v10-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-v10-${{ runner.os }}-
            atlas-state-v10-


      # ============================================================
      # 5. PREPARE SOURCE
      # ============================================================
      - name: Prepare ATLAS v10.0 source
        run: |
          if [ -f bot.py ]; then
            echo "Found bot.py"
          elif [ -f AtlasAI_v10_bot.py ]; then
            echo "Found AtlasAI_v10_bot.py; copying to bot.py"
            cp AtlasAI_v10_bot.py bot.py
          elif [ -f AtlasAI_v10_FIXED.py ]; then
            echo "Found AtlasAI_v10_FIXED.py; copying to bot.py"
            cp AtlasAI_v10_FIXED.py bot.py
          else
            echo "ERROR: bot.py is missing from the checked-out repository."
            echo "Expected one of:"
            echo "  bot.py"
            echo "  AtlasAI_v10_bot.py"
            echo "  AtlasAI_v10_FIXED.py"
            echo ""
            echo "Repository files:"
            ls -la
            exit 1
          fi


      # ============================================================
      # 6. VALIDATE PYTHON
      # ============================================================
      - name: Validate ATLAS v10.0 source
        run: |
          test -f bot.py
          python -m py_compile bot.py
          echo "ATLAS v10.0 syntax: OK"


      # ============================================================
      # 7. OPTIONAL SMOKE TEST
      # ============================================================
      - name: Run ATLAS smoke test
        run: |
          if [ -f atlas_v10_smoke_test.py ]; then
            python atlas_v10_smoke_test.py
          elif [ -f atlas_v9_1_smoke_test.py ]; then
            python atlas_v9_1_smoke_test.py
          elif [ -f atlas_v9_smoke_test.py ]; then
            python atlas_v9_smoke_test.py
          else
            echo "No ATLAS smoke test found; skipping."
          fi


      # ============================================================
      # 8. RUN ATLAS
      # ============================================================
      - name: Run ATLAS v10.0 Market Supervisor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          SUPABASE_URL: "https://tmnfhsuwtqfpglckfxwg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          # ========================================================
          # ATLAS VERSION / CORE
          # ========================================================
          ATLAS_VERSION: "10.0"
          ATLAS_TIMEFRAME: "4H"

          # ========================================================
          # RISK
          # ========================================================
          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
          ATLAS_MIN_CONFIDENCE: "60"
          ATLAS_MAX_LEVERAGE: "10"

          # ========================================================
          # BACKTEST
          # ========================================================
          ATLAS_BACKTEST_DAYS: "180"
          ATLAS_SIGNAL_HORIZON_BARS: "36"
          ATLAS_BACKTEST_IMPROVEMENT: "10"
          ATLAS_BACKTEST_REFRESH_HOURS: "24"

          # ========================================================
          # SIGNAL MEMORY / DEDUP
          # ========================================================
          ATLAS_SIGNAL_MEMORY_HOURS: "12"
          ATLAS_CANDLE_EVENT_DEDUP: "1"

          # ========================================================
          # MARKET BREADTH
          # ========================================================
          ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

          # ========================================================
          # WATCH
          # ========================================================
          ATLAS_MIN_WATCH_CONFIDENCE: "55"

          # ========================================================
          # DATA QUALITY
          # ========================================================
          ATLAS_MIN_VOLUME_RATIO: "0.80"
          ATLAS_H4_FALLBACK_MIN_SCORE: "70"
          ATLAS_REQUEST_SLEEP_SECONDS: "0.50"

          # ========================================================
          # EXECUTABLE TRADE QUALITY
          # ========================================================
          ATLAS_MIN_EXECUTABLE_RR: "2.0"

          # ========================================================
          # BTC REGIME CACHE
          # ========================================================
          ATLAS_BTC_REGIME_CACHE_MINUTES: "30"

          # ========================================================
          # DATABASE / CHANGELOG
          # ========================================================
          ATLAS_SQLITE_FILE: "atlas_v10.sqlite3"
          ATLAS_CHANGELOG: "changelog.txt"

          PYTHONUNBUFFERED: "1"

        run: |
          python bot.py


      # ============================================================
      # 9. SAVE UPDATED LOCAL STATE
      #
      # IMPORTANT:
      # This happens AFTER bot.py.
      # A new cache key is created for this run.
      # Future runs recover the latest available state
      # through restore-keys.
      # ============================================================
      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v10.sqlite3
            changelog.txt
          key: atlas-state-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


      # ============================================================
      # 10. DEBUG STATE
      # ============================================================
      - name: Show ATLAS state files
        if: always()
        run: |
          echo "===== ATLAS STATE ====="

          if [ -f atlas_v10.sqlite3 ]; then
            ls -lh atlas_v10.sqlite3
          else
            echo "atlas_v10.sqlite3 not found"
          fi

          if [ -f changelog.txt ]; then
            ls -lh changelog.txt
          else
            echo "changelog.txt not found"
          fi

name: ATLAS v10.1 Market Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  atlas:
    name: ATLAS v10.1 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout ATLAS repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade ccxt

      # ==========================================================
      # 4. SOURCE VERIFICATION
      # ==========================================================
      - name: Verify ATLAS source files
        run: |
          echo "=============================================="
          echo " ATLAS v10.1 FILE VERIFICATION"
          echo "=============================================="

          echo "--- Repository ---"
          pwd
          ls -la

          echo "--- Workflows ---"
          ls -la .github/workflows || true

          echo "--- Python files ---"
          ls -la *.py || true

          echo "--- Required source ---"

          if [ ! -f bot.py ]; then
            echo "ERROR: bot.py not found"
            exit 1
          fi

          echo "OK: bot.py found"

          # ------------------------------------------------------
          # Smoke-test compatibility:
          # Prefer the new v10.1 name.
          # If repository still contains the previous v10 smoke
          # test, use it instead of failing the entire workflow.
          # ------------------------------------------------------

          if [ -f atlas_v10_1_smoke_test.py ]; then
            echo "OK: atlas_v10_1_smoke_test.py found"
            echo "ATLAS_SMOKE_TEST=atlas_v10_1_smoke_test.py" >> "$GITHUB_ENV"

          elif [ -f atlas_v10_smoke_test.py ]; then
            echo "OK: atlas_v10_smoke_test.py found"
            echo "Using compatible v10 smoke test."
            echo "ATLAS_SMOKE_TEST=atlas_v10_smoke_test.py" >> "$GITHUB_ENV"

          else
            echo "WARNING: No ATLAS smoke test file found."
            echo "ATLAS_SMOKE_TEST=" >> "$GITHUB_ENV"
          fi

      # ==========================================================
      # 5. RESTORE PERSISTENT STATE
      # ==========================================================
      #
      # IMPORTANT:
      # SQLite is only a runner-local fallback.
      # Supabase remains the primary persistent store.
      #
      # GitHub cache keys are immutable.
      # Therefore restore uses restore-keys and save uses a
      # unique run-specific key.
      #
      # ==========================================================

      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v101.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-v101-${{ runner.os }}-

      # ==========================================================
      # 6. PYTHON SYNTAX CHECK
      # ==========================================================
      - name: Validate ATLAS v10.1 source
        run: |
          test -f bot.py
          python -m py_compile bot.py
          echo "ATLAS v10.1 syntax: OK"

      # ==========================================================
      # 7. SMOKE TEST
      # ==========================================================
      - name: Run ATLAS smoke test
        run: |
          if [ -n "${ATLAS_SMOKE_TEST}" ]; then
            echo "Running: ${ATLAS_SMOKE_TEST}"
            python "${ATLAS_SMOKE_TEST}"
          else
            echo "No smoke test present."
            echo "Smoke test skipped."
          fi

      # ==========================================================
      # 8. RUN ATLAS
      # ==========================================================
      - name: Run ATLAS v10.1 Market Supervisor
        env:

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          SUPABASE_URL: "https://tmnfhsuwtqfpglckfxwg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          ATLAS_VERSION: "10.1"
          ATLAS_TIMEFRAME: "4H"

          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

          ATLAS_MIN_CONFIDENCE: "60"
          ATLAS_MAX_LEVERAGE: "10"

          ATLAS_BACKTEST_DAYS: "180"
          ATLAS_SIGNAL_HORIZON_BARS: "36"
          ATLAS_BACKTEST_IMPROVEMENT: "10"
          ATLAS_BACKTEST_REFRESH_HOURS: "24"

          ATLAS_MIN_VOLUME_RATIO: "0.80"
          ATLAS_H4_FALLBACK_MIN_SCORE: "70"
          ATLAS_REQUEST_SLEEP_SECONDS: "0.50"

          ATLAS_CANDLE_EVENT_DEDUP: "1"

          ATLAS_MIN_EXECUTABLE_RR: "2.0"
          ATLAS_MIN_WATCH_CONFIDENCE: "55"

          ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
          ATLAS_SIGNAL_MEMORY_HOURS: "12"
          ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

          ATLAS_SQLITE_FILE: "atlas_v101.sqlite3"
          ATLAS_CHANGELOG: "changelog.txt"

        run: |
          echo "=============================================="
          echo " ATLAS v10.1 START"
          echo "=============================================="

          python bot.py

          echo "=============================================="
          echo " ATLAS v10.1 FINISHED"
          echo "=============================================="

      # ==========================================================
      # 9. SAVE PERSISTENT STATE
      # ==========================================================
      #
      # GitHub cache entries are immutable.
      # Unique key = current run.
      # Next run restores the newest matching cache via
      # restore-keys.
      #
      # ==========================================================

      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v101.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ==========================================================
      # 10. UPLOAD DIAGNOSTICS
      # ==========================================================

      - name: Upload ATLAS v10.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.1-diagnostics-${{ github.run_id }}

          path: |
            atlas_v101.sqlite3
            changelog.txt

          if-no-files-found: ignore
          retention-days: 14

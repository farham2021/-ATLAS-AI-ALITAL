name: ATLAS v10.0 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # اجرای اصلی هر 4 ساعت
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    name: ATLAS v10.0 Market Supervisor
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

      # ============================================================
      # ATLAS
      # ============================================================
      ATLAS_VERSION: "10.0"
      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"

      # Persistent local state
      ATLAS_SQLITE_FILE: "atlas_v10.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      # ============================================================
      # API / TELEGRAM
      # ============================================================
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. PYTHON
      # ============================================================
      #
      # IMPORTANT:
      # Do NOT use:
      #   cache: pip
      #   cache-dependency-path: requirements.txt
      #
      # because this repository currently does not contain
      # requirements.txt.
      #
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      #
      # ATLAS currently requires ccxt.
      # Everything else used by the core bot is Python standard
      # library / built-in functionality.
      #
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ccxt

      # ============================================================
      # 4. RESTORE PERSISTENT ATLAS STATE
      # ============================================================
      #
      # SQLite contains:
      # - backtest cache
      # - signal memory
      # - duplicate-signal detection
      # - closed-candle / outcome state
      # - diagnostic state
      #
      # IMPORTANT:
      # run_id is NOT used as the only cache key.
      #
      # Each run creates a new cache snapshot while restore-keys
      # retrieves the newest previous snapshot.
      #
      - name: Restore ATLAS persistent state
        uses: actions/cache@v4
        with:
          path: |
            atlas_v10.sqlite3
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10-${{ github.run_number }}

          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-${{ runner.os }}-

      # ============================================================
      # 5. VERIFY FILES
      # ============================================================
      - name: Verify ATLAS files
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Workflow:"
          ls -la .github/workflows || true

          echo ""
          echo "Checking bot.py..."
          test -f bot.py

      # ============================================================
      # 6. PYTHON SYNTAX CHECK
      # ============================================================
      - name: Validate Python syntax
        run: |
          python -m py_compile bot.py

      # ============================================================
      # 7. TELEGRAM / SECRET PREFLIGHT
      # ============================================================
      #
      # We do not print secrets.
      #
      - name: Validate required secrets
        run: |
          test -n "$TELEGRAM_TOKEN" || (echo "ERROR: TELEGRAM_TOKEN missing" && exit 1)

          if [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID and TELEGRAM_GROUP_CHAT_ID are both missing"
            exit 1
          fi

          echo "Telegram configuration detected."

      # ============================================================
      # 8. RUN ATLAS
      # ============================================================
      - name: Run ATLAS v10.0
        run: |
          echo "=============================================="
          echo " ATLAS v10.0 START"
          echo "=============================================="
          echo "Python:"
          python --version
          echo ""
          echo "CCXT:"
          python -c "import ccxt; print(ccxt.__version__)"
          echo ""
          echo "ATLAS:"
          python bot.py

      # ============================================================
      # 9. VERIFY SQLITE / CHANGELOG
      # ============================================================
      #
      # This does not fail the job if SQLite was not created,
      # because ATLAS may be configured to operate without local
      # persistence in some circumstances.
      #
      - name: Inspect ATLAS state
        if: always()
        run: |
          echo "=============================================="
          echo " ATLAS STATE"
          echo "=============================================="

          if [ -f atlas_v10.sqlite3 ]; then
            ls -lh atlas_v10.sqlite3
          else
            echo "atlas_v10.sqlite3 not created."
          fi

          echo ""

          if [ -f changelog.txt ]; then
            echo "Last 40 changelog lines:"
            tail -n 40 changelog.txt
          else
            echo "changelog.txt not created."
          fi

      # ============================================================
      # 10. UPLOAD DEBUG ARTIFACT
      # ============================================================
      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10-state-${{ github.run_number }}
          path: |
            atlas_v10.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

name: ATLAS AI v10.3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ATLAS execution mode"
        required: true
        default: "GLOBAL"
        type: choice
        options:
          - GLOBAL
          - PERSONAL
          - BOTH

  schedule:
    # GLOBAL — سه نوبت ثابت بازار جهانی
    - cron: "30 4,10,16 * * *"

    # PERSONAL — هر 4 ساعت
    - cron: "35 20,0,4,8,12,16 * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
  CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
  CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
  ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

jobs:

  # ============================================================
  # GLOBAL MARKET
  # ============================================================

  global-market:

    name: ATLAS Global Market — 3x Daily

    if: >-
      (github.event_name == 'schedule' &&
       (github.event.schedule == '30 4,10,16 * * *')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.mode == 'GLOBAL' ||
        github.event.inputs.mode == 'BOTH' ||
        github.event.inputs.mode == ''))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ATLAS_MODE: GLOBAL
      ATLAS_VERSION: "10.3"

      ATLAS_SQLITE_FILE: "atlas_v103_global.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_SIGNAL_MEMORY_HOURS: "12"
      ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

      ATLAS_SIGNAL_HORIZON_BARS: "36"

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install --upgrade ccxt

      # --------------------------------------------------------
      # RESTORE PERSISTENT STATE
      #
      # IMPORTANT:
      # This MUST happen before bot.py.
      # --------------------------------------------------------

      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v103_global.sqlite3
            atlas_v103_global.sqlite3-wal
            atlas_v103_global.sqlite3-shm
            changelog.txt

          key: atlas-v103-global-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            atlas-v103-global-${{ github.ref_name }}-
            atlas-v103-global-

      # --------------------------------------------------------
      # VERIFY RESTORED STATE
      # --------------------------------------------------------

      - name: Inspect restored ATLAS state
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.3 RESTORED STATE"
          echo "=============================================="

          if [ -f atlas_v103_global.sqlite3 ]; then
            echo "SQLite state restored:"
            ls -lh atlas_v103_global.sqlite3
          else
            echo "No previous SQLite state found."
          fi

          if [ -f changelog.txt ]; then
            echo "Changelog restored:"
            ls -lh changelog.txt
            echo "---- changelog tail ----"
            tail -n 20 changelog.txt
          else
            echo "No previous changelog found."
          fi

      # --------------------------------------------------------
      # REPOSITORY + PYTHON VALIDATION
      # --------------------------------------------------------

      - name: Validate repository and Python
        run: |
          set -euo pipefail

          test -f bot.py
          test -f requirements.txt
          test -f atlas_v10_3_smoke_test.py

          python -m py_compile bot.py

          python -m py_compile atlas_v10_3_smoke_test.py

          python atlas_v10_3_smoke_test.py

          test -n "$TELEGRAM_TOKEN" || {
            echo "ERROR: TELEGRAM_TOKEN missing"
            exit 1
          }

          if [ -z "$TELEGRAM_CHAT_ID" ] &&
             [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: Telegram destination missing"
            exit 1
          fi

          echo "Repository validation: PASS"
          echo "Python validation: PASS"
          echo "Telegram configuration: PASS"

      # --------------------------------------------------------
      # RUN ATLAS
      # --------------------------------------------------------

      - name: Run ATLAS GLOBAL
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.3 GLOBAL START"
          echo "=============================================="

          python --version
          python -c "import ccxt; print('CCXT:', ccxt.__version__)"

          python bot.py

      # --------------------------------------------------------
      # FINALIZE SQLITE
      #
      # MUST happen before cache/save.
      # --------------------------------------------------------

      - name: Finalize SQLite state
        if: always()
        run: |
          set -euo pipefail

          if [ -f atlas_v103_global.sqlite3 ]; then

            python - <<'PY'
          import sqlite3

          db = "atlas_v103_global.sqlite3"

          con = sqlite3.connect(db, timeout=30)

          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA optimize")

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              print(
                  "SQLite integrity:",
                  result[0] if result else "UNKNOWN"
              )

          finally:
              con.close()
          PY

          else
            echo "SQLite database was not created."
          fi

      # --------------------------------------------------------
      # INSPECT FINAL STATE
      # --------------------------------------------------------

      - name: Inspect final ATLAS state
        if: always()
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.3 FINAL STATE"
          echo "=============================================="

          if [ -f atlas_v103_global.sqlite3 ]; then
            ls -lh atlas_v103_global.sqlite3
            sqlite3 atlas_v103_global.sqlite3 \
              "PRAGMA integrity_check;" || true
          fi

          if [ -f changelog.txt ]; then
            echo "---- changelog tail ----"
            tail -n 40 changelog.txt
          fi

      # --------------------------------------------------------
      # SAVE PERSISTENT CACHE
      #
      # UNIQUE RUN KEY
      # This allows GitHub to create a new cache snapshot.
      # The next execution restores the newest matching cache
      # through restore-keys.
      # --------------------------------------------------------

      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v103_global.sqlite3
            atlas_v103_global.sqlite3-wal
            atlas_v103_global.sqlite3-shm
            changelog.txt

          key: atlas-v103-global-${{ github.ref_name }}-${{ github.run_id }}

      # --------------------------------------------------------
      # ARTIFACT BACKUP
      #
      # Cache = fast state restoration
      # Artifact = independent audit/backup
      # --------------------------------------------------------

      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.3-global-state-${{ github.run_number }}

          path: |
            atlas_v103_global.sqlite3
            changelog.txt

          if-no-files-found: ignore
          retention-days: 30


  # ============================================================
  # PERSONAL PORTFOLIO
  # ============================================================

  personal-portfolio:

    name: ATLAS Personal Portfolio — Every 4H

    if: >-
      (github.event_name == 'schedule' &&
       github.event.schedule == '35 20,0,4,8,12,16 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.mode == 'PERSONAL' ||
        github.event.inputs.mode == 'BOTH' ||
        github.event.inputs.mode == ''))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ATLAS_MODE: PERSONAL
      ATLAS_VERSION: "10.3"

      ATLAS_SQLITE_FILE: "atlas_v103_personal.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_SIGNAL_MEMORY_HOURS: "12"
      ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

      ATLAS_SIGNAL_HORIZON_BARS: "36"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install --upgrade ccxt

      # --------------------------------------------------------
      # RESTORE PERSONAL STATE
      # --------------------------------------------------------

      - name: Restore personal ATLAS state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v103_personal.sqlite3
            atlas_v103_personal.sqlite3-wal
            atlas_v103_personal.sqlite3-shm
            changelog.txt

          key: atlas-v103-personal-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            atlas-v103-personal-${{ github.ref_name }}-
            atlas-v103-personal-

      - name: Inspect restored personal state
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.3 PERSONAL RESTORED STATE"
          echo "=============================================="

          if [ -f atlas_v103_personal.sqlite3 ]; then
            ls -lh atlas_v103_personal.sqlite3
          else
            echo "No previous personal SQLite state found."
          fi

          if [ -f changelog.txt ]; then
            tail -n 20 changelog.txt
          fi

      # --------------------------------------------------------
      # VALIDATE
      # --------------------------------------------------------

      - name: Validate repository and Python
        run: |
          set -euo pipefail

          test -f bot.py
          test -f requirements.txt
          test -f atlas_v10_3_smoke_test.py

          python -m py_compile bot.py
          python -m py_compile atlas_v10_3_smoke_test.py

          python atlas_v10_3_smoke_test.py

          test -n "$TELEGRAM_TOKEN" || {
            echo "ERROR: TELEGRAM_TOKEN missing"
            exit 1
          }

          if [ -z "$TELEGRAM_CHAT_ID" ] &&
             [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: Telegram destination missing"
            exit 1
          fi

      # --------------------------------------------------------
      # RUN PERSONAL
      # --------------------------------------------------------

      - name: Run ATLAS PERSONAL
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.3 PERSONAL START"
          echo "=============================================="

          python --version
          python -c "import ccxt; print('CCXT:', ccxt.__version__)"

          python bot.py

      # --------------------------------------------------------
      # FINALIZE PERSONAL SQLITE
      # --------------------------------------------------------

      - name: Finalize personal SQLite state
        if: always()
        run: |
          set -euo pipefail

          if [ -f atlas_v103_personal.sqlite3 ]; then

            python - <<'PY'
          import sqlite3

          db = "atlas_v103_personal.sqlite3"

          con = sqlite3.connect(db, timeout=30)

          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA optimize")

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              print(
                  "SQLite integrity:",
                  result[0] if result else "UNKNOWN"
              )

          finally:
              con.close()
          PY

          else
            echo "Personal SQLite database was not created."
          fi

      # --------------------------------------------------------
      # INSPECT PERSONAL STATE
      # --------------------------------------------------------

      - name: Inspect final personal state
        if: always()
        run: |
          set -euo pipefail

          if [ -f atlas_v103_personal.sqlite3 ]; then
            ls -lh atlas_v103_personal.sqlite3
            sqlite3 atlas_v103_personal.sqlite3 \
              "PRAGMA integrity_check;" || true
          fi

          if [ -f changelog.txt ]; then
            echo "---- changelog tail ----"
            tail -n 40 changelog.txt
          fi

      # --------------------------------------------------------
      # SAVE PERSONAL CACHE
      # --------------------------------------------------------

      - name: Save personal ATLAS state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v103_personal.sqlite3
            atlas_v103_personal.sqlite3-wal
            atlas_v103_personal.sqlite3-shm
            changelog.txt

          key: atlas-v103-personal-${{ github.ref_name }}-${{ github.run_id }}

      # --------------------------------------------------------
      # ARTIFACT BACKUP
      # --------------------------------------------------------

      - name: Upload personal ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.3-personal-state-${{ github.run_number }}

          path: |
            atlas_v103_personal.sqlite3
            changelog.txt

          if-no-files-found: ignore
          retention-days: 30

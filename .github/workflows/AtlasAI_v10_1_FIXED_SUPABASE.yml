name: ATLAS v10.1 Market Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  atlas:
    name: ATLAS v10.1 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ATLAS_VERSION: "10.1"
      ATLAS_TIMEFRAME: "4H"
      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"
      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"
      ATLAS_MIN_VOLUME_RATIO: "0.80"
      ATLAS_H4_FALLBACK_MIN_SCORE: "70"
      ATLAS_REQUEST_SLEEP_SECONDS: "0.50"
      ATLAS_CANDLE_EVENT_DEDUP: "1"
      ATLAS_MIN_EXECUTABLE_RR: "2.0"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"
      ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
      ATLAS_SIGNAL_MEMORY_HOURS: "12"
      ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"
      ATLAS_SQLITE_FILE: "atlas_v10_1.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Supabase is the PRIMARY state store. SQLite is restored only as a
      # local fallback/audit copy. The unique run key permits a new cache
      # snapshot on every run; restore-keys recover the newest prior copy.
      - name: Restore ATLAS fallback state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v10_1.sqlite3
            atlas_v10_1.sqlite3-wal
            atlas_v10_1.sqlite3-shm
            changelog.txt
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.1-${{ github.run_id }}
          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.1-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-${{ runner.os }}-

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ATLAS dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade ccxt

      - name: Prepare bot.py
        run: |
          set -euo pipefail
          if [ -f bot.py ]; then
            echo "Using bot.py"
          elif [ -f AtlasAI_v10_1_bot.py ]; then
            cp AtlasAI_v10_1_bot.py bot.py
          else
            echo "ERROR: bot.py or AtlasAI_v10_1_bot.py not found"
            ls -la
            exit 1
          fi

      - name: Validate source
        run: |
          set -euo pipefail
          test -f bot.py
          python -m py_compile bot.py
          echo "ATLAS v10.1 syntax: OK"

      - name: Run v10.1 smoke test
        run: |
          set -euo pipefail
          if [ -f atlas_v10_1_smoke_test.py ]; then
            python atlas_v10_1_smoke_test.py
          else
            echo "Smoke test not present; continuing."
          fi

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_TOKEN" || { echo "ERROR: TELEGRAM_TOKEN missing"; exit 1; }
          if [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: both Telegram destinations are missing"
            exit 1
          fi
          test -n "$SUPABASE_URL" || { echo "ERROR: SUPABASE_URL missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "ERROR: SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }
          echo "Required secrets: OK"

      - name: Run ATLAS v10.1
        run: |
          set -euo pipefail
          python --version
          python -c "import ccxt; print('CCXT:', ccxt.__version__)"
          python bot.py

      - name: Finalize SQLite fallback state
        if: always()
        run: |
          set -euo pipefail
          DB="$ATLAS_SQLITE_FILE"
          if [ -f "$DB" ]; then
            python - <<'PY'
          import os, sqlite3
          db = os.environ.get("ATLAS_SQLITE_FILE", "atlas_v10_1.sqlite3")
          con = sqlite3.connect(db, timeout=30)
          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA optimize")
              result = con.execute("PRAGMA integrity_check").fetchone()
              print("SQLite integrity:", result[0] if result else "UNKNOWN")
              if not result or result[0] != "ok":
                  raise SystemExit("SQLite integrity check failed")
          finally:
              con.close()
          PY
          else
            echo "No local SQLite fallback file was created."
          fi

      - name: Inspect persistent state
        if: always()
        run: |
          set -euo pipefail
          echo "===== ATLAS v10.1 PERSISTENCE ====="
          if [ -f "$ATLAS_SQLITE_FILE" ]; then ls -lh "$ATLAS_SQLITE_FILE"; fi
          if [ -f changelog.txt ]; then tail -n 40 changelog.txt; fi
          echo "Supabase is the primary persistence layer; SQLite is fallback/audit."

      - name: Save ATLAS fallback state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v10_1.sqlite3
            atlas_v10_1.sqlite3-wal
            atlas_v10_1.sqlite3-shm
            changelog.txt
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.1-${{ github.run_id }}

      - name: Upload ATLAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10-1-diagnostics-${{ github.run_id }}
          path: |
            atlas_v10_1.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

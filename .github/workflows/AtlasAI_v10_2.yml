name: ATLAS v10.2 Market Supervisor

on:
  workflow_dispatch:
  schedule:
    # اجرای اصلی هر 4 ساعت
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    name: ATLAS v10.2 Market Supervisor
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      ATLAS_VERSION: "10.2"
      ATLAS_TIMEFRAME: "4H"
      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"
      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"
      ATLAS_SQLITE_FILE: "atlas_v102.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ccxt

      # IMPORTANT:
      # GitHub-hosted runners are ephemeral. The cache is restored BEFORE
      # bot.py starts so backtest cache, signal memory, candle events and
      # Telegram delivery state survive between scheduled runs.
      - name: Restore ATLAS persistent state
        uses: actions/cache@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-${{ github.run_number }}
          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-${{ runner.os }}-

      - name: Verify ATLAS files
        run: |
          pwd
          ls -la
          ls -la .github/workflows || true
          test -f bot.py
          test -f atlas_v10_2_smoke_test.py

      - name: Validate Python syntax
        run: |
          python -m py_compile bot.py
          python -m py_compile atlas_v10_2_smoke_test.py

      - name: Run ATLAS v10.2 smoke test
        run: python atlas_v10_2_smoke_test.py

      - name: Validate required secrets
        run: |
          test -n "$TELEGRAM_TOKEN" || (echo "ERROR: TELEGRAM_TOKEN missing" && exit 1)
          if [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID and TELEGRAM_GROUP_CHAT_ID are both missing"
            exit 1
          fi
          echo "Telegram configuration detected."

      - name: Run ATLAS v10.2
        run: |
          echo "=============================================="
          echo " ATLAS v10.2 START"
          echo "=============================================="
          python --version
          python -c "import ccxt; print('CCXT', ccxt.__version__)"
          python bot.py

      # Flush WAL into atlas_v102.sqlite3 BEFORE the cache action saves the
      # workspace. This is the critical persistence step for ephemeral runners.
      - name: Finalize SQLite state
        if: always()
        run: |
          if [ -f atlas_v102.sqlite3 ]; then
            python - <<'PY'
          import sqlite3
          db = "atlas_v102.sqlite3"
          con = sqlite3.connect(db, timeout=30)
          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA optimize")
              result = con.execute("PRAGMA integrity_check").fetchone()
              print("SQLite integrity:", result[0] if result else "UNKNOWN")
          finally:
              con.close()
          PY
          else
            echo "atlas_v102.sqlite3 not created."
          fi

      - name: Inspect ATLAS state
        if: always()
        run: |
          echo "=============================================="
          echo " ATLAS v10.2 STATE"
          echo "=============================================="
          if [ -f atlas_v102.sqlite3 ]; then ls -lh atlas_v102.sqlite3; else echo "atlas_v102.sqlite3 not created."; fi
          if [ -f changelog.txt ]; then tail -n 40 changelog.txt; else echo "changelog.txt not created."; fi

      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.2-state-${{ github.run_number }}
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

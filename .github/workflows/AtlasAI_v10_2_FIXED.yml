name: ATLAS v10.2 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # اجرای اصلی هر 4 ساعت
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    name: ATLAS v10.2 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

      # ============================================================
      # ATLAS CONFIGURATION
      # ============================================================
      ATLAS_VERSION: "10.2"
      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_CANDLE_EVENT_DEDUP: "1"

      # ============================================================
      # PERSISTENT LOCAL STATE
      # ============================================================
      ATLAS_SQLITE_FILE: "atlas_v102.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      # ============================================================
      # TELEGRAM
      # ============================================================
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ============================================================
      # SUPABASE
      # ============================================================
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ============================================================
      # MARKET / NEWS APIs
      # ============================================================
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install ATLAS dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install --upgrade ccxt

          echo "Installed Python packages:"
          python -m pip list

      # ============================================================
      # 4. RESTORE PERSISTENT ATLAS STATE
      #
      # IMPORTANT:
      # GitHub-hosted runners are ephemeral.
      #
      # We restore BEFORE bot.py starts.
      #
      # The restore key searches for the newest previous ATLAS state.
      # ============================================================
      - name: Restore ATLAS persistent state
        id: atlas-state-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt

          # Unique key for this run.
          # This allows a NEW cache entry to be saved later.
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-${{ github.run_id }}

          # Look for the newest previous state.
          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-${{ runner.os }}-

      # ============================================================
      # 5. SHOW RESTORE RESULT
      # ============================================================
      - name: Report persistent state restore
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS PERSISTENT STATE"
          echo "=============================================="

          if [ -f atlas_v102.sqlite3 ]; then
            echo "SQLite state restored: YES"
            ls -lh atlas_v102.sqlite3
          else
            echo "SQLite state restored: NO — first run or no cache found."
          fi

          if [ -f changelog.txt ]; then
            echo "Changelog restored: YES"
            ls -lh changelog.txt
          else
            echo "Changelog restored: NO"
          fi

      # ============================================================
      # 6. VERIFY REPOSITORY
      # ============================================================
      - name: Verify ATLAS repository files
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.2 REPOSITORY CHECK"
          echo "=============================================="

          pwd

          echo "---- repository ----"
          ls -la

          echo "---- workflows ----"
          ls -la .github/workflows || true

          test -f bot.py

          if [ -f atlas_v10_2_smoke_test.py ]; then
            echo "Smoke test found: atlas_v10_2_smoke_test.py"
          elif [ -f atlas_v9_smoke_test.py ]; then
            echo "Legacy smoke test found: atlas_v9_smoke_test.py"
          else
            echo "WARNING: No ATLAS smoke test file found."
          fi

          echo "bot.py: OK"

      # ============================================================
      # 7. PYTHON SYNTAX
      # ============================================================
      - name: Validate Python syntax
        run: |
          set -euo pipefail

          python -m py_compile bot.py

          if [ -f atlas_v10_2_smoke_test.py ]; then
            python -m py_compile atlas_v10_2_smoke_test.py
          elif [ -f atlas_v9_smoke_test.py ]; then
            python -m py_compile atlas_v9_smoke_test.py
          fi

          echo "Python syntax: PASS"

      # ============================================================
      # 8. SMOKE TEST
      # ============================================================
      - name: Run ATLAS smoke test
        run: |
          set -euo pipefail

          if [ -f atlas_v10_2_smoke_test.py ]; then
            echo "Running ATLAS v10.2 smoke test..."
            python atlas_v10_2_smoke_test.py

          elif [ -f atlas_v9_smoke_test.py ]; then
            echo "Running legacy ATLAS smoke test..."
            python atlas_v9_smoke_test.py

          else
            echo "No smoke test file present; continuing."
          fi

      # ============================================================
      # 9. VALIDATE REQUIRED SECRETS
      # ============================================================
      - name: Validate ATLAS secrets
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS SECRET CHECK"
          echo "=============================================="

          test -n "$TELEGRAM_TOKEN" || {
            echo "ERROR: TELEGRAM_TOKEN is missing."
            exit 1
          }

          if [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_GROUP_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID and TELEGRAM_GROUP_CHAT_ID are both missing."
            exit 1
          fi

          echo "Telegram configuration: OK"

          if [ -n "$SUPABASE_URL" ]; then
            echo "Supabase URL: configured"
          else
            echo "Supabase URL: NOT configured"
          fi

          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase service key: configured"
          else
            echo "Supabase service key: NOT configured"
          fi

          if [ -n "$COINGLASS_API_KEY" ]; then
            echo "CoinGlass API: configured"
          else
            echo "CoinGlass API: NOT configured"
          fi

      # ============================================================
      # 10. RUN ATLAS
      # ============================================================
      - name: Run ATLAS v10.2 Market Supervisor
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " ATLAS v10.2 START"
          echo "=============================================="

          python --version

          python -c "import ccxt; print('CCXT:', ccxt.__version__)"

          echo "SQLite file:"
          echo "$ATLAS_SQLITE_FILE"

          echo "Backtest refresh:"
          echo "${ATLAS_BACKTEST_REFRESH_HOURS} hours"

          echo "Timeframe:"
          echo "$ATLAS_TIMEFRAME"

          python bot.py

      # ============================================================
      # 11. FINALIZE SQLITE
      #
      # VERY IMPORTANT:
      # SQLite must be closed/checkpointed BEFORE cache/save.
      #
      # This prevents WAL/shm state from being inconsistent.
      # ============================================================
      - name: Finalize SQLite state
        if: always()
        run: |
          set -euo pipefail

          DB="$ATLAS_SQLITE_FILE"

          echo "=============================================="
          echo " FINALIZING SQLITE"
          echo "=============================================="

          if [ -f "$DB" ]; then

            python - <<'PY'
          import os
          import sqlite3

          db = os.environ.get("ATLAS_SQLITE_FILE", "atlas_v102.sqlite3")

          print("SQLite database:", db)

          con = sqlite3.connect(db, timeout=30)

          try:
              # Force WAL contents into the main DB.
              result = con.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              ).fetchone()

              print("WAL checkpoint:", result)

              con.execute("PRAGMA optimize")

              integrity = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              print(
                  "SQLite integrity:",
                  integrity[0] if integrity else "UNKNOWN"
              )

              if not integrity or integrity[0] != "ok":
                  raise RuntimeError(
                      f"SQLite integrity check failed: {integrity}"
                  )

              con.commit()

          finally:
              con.close()
          PY

          else
            echo "SQLite database does not exist."
          fi

      # ============================================================
      # 12. INSPECT STATE
      # ============================================================
      - name: Inspect ATLAS persistent state
        if: always()
        run: |
          set -euo pipefail

          DB="$ATLAS_SQLITE_FILE"

          echo "=============================================="
          echo " ATLAS v10.2 STATE INSPECTION"
          echo "=============================================="

          if [ -f "$DB" ]; then
            echo "Database:"
            ls -lh "$DB"

            echo ""
            echo "SQLite integrity:"
            python - <<'PY'
          import os
          import sqlite3

          db = os.environ.get("ATLAS_SQLITE_FILE", "atlas_v102.sqlite3")

          con = sqlite3.connect(db)

          try:
              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              print(result[0] if result else "UNKNOWN")

              tables = con.execute(
                  """
                  SELECT name
                  FROM sqlite_master
                  WHERE type='table'
                  ORDER BY name
                  """
              ).fetchall()

              print("")
              print("Tables:")

              for table in tables:
                  print(" -", table[0])

          finally:
              con.close()
          PY

          else
            echo "Database not found."
          fi

          echo ""

          if [ -f changelog.txt ]; then
            echo "---- changelog tail ----"
            tail -n 40 changelog.txt
          else
            echo "changelog.txt not found."
          fi

      # ============================================================
      # 13. SAVE PERSISTENT STATE
      #
      # IMPORTANT:
      # GitHub Actions cache keys are IMMUTABLE.
      #
      # Therefore we MUST use a UNIQUE key for every run.
      #
      # The next run will recover this newest state through
      # restore-keys.
      # ============================================================
      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-${{ github.run_id }}

      # ============================================================
      # 14. UPLOAD STATE ARTIFACT
      #
      # This is an additional backup/debugging mechanism.
      # It is NOT the primary persistence mechanism.
      # ============================================================
      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.2-state-${{ github.run_number }}

          path: |
            atlas_v102.sqlite3
            changelog.txt

          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 15. FINAL STATUS
      # ============================================================
      - name: ATLAS final status
        if: always()
        run: |
          echo "=============================================="
          echo " ATLAS v10.2 JOB COMPLETE"
          echo "=============================================="

          if [ "${{ job.status }}" = "success" ]; then
            echo "ATLAS STATUS: SUCCESS"
          else
            echo "ATLAS STATUS: ${{ job.status }}"
          fi

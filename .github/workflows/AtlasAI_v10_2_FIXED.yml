name: ATLAS v10.2 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # هر 4 ساعت
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    name: ATLAS v10.2 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

      # =========================
      # ATLAS VERSION / ENGINE
      # =========================
      ATLAS_VERSION: "10.2"
      ATLAS_TIMEFRAME: "4H"

      # =========================
      # RISK MANAGEMENT
      # =========================
      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"

      # =========================
      # BACKTEST
      # =========================
      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      # =========================
      # SIGNAL ENGINE
      # =========================
      ATLAS_MIN_VOLUME_RATIO: "0.80"
      ATLAS_H4_FALLBACK_MIN_SCORE: "70"
      ATLAS_REQUEST_SLEEP_SECONDS: "0.50"
      ATLAS_CANDLE_EVENT_DEDUP: "1"

      ATLAS_MIN_EXECUTABLE_RR: "2.0"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
      ATLAS_SIGNAL_MEMORY_HOURS: "12"
      ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

      # =========================
      # PERSISTENT LOCAL STATE
      # =========================
      ATLAS_SQLITE_FILE: "atlas_v102.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      # =========================
      # TELEGRAM
      # =========================
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # =========================
      # SUPABASE
      # =========================
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # =========================
      # MARKET DATA
      # =========================
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. RESTORE PERSISTENT ATLAS STATE
      # ==========================================================
      #
      # GitHub-hosted runners are ephemeral.
      #
      # We restore:
      # - SQLite
      # - SQLite WAL
      # - SQLite SHM
      # - changelog
      #
      # This allows:
      # - backtest cache
      # - signal memory
      # - candle deduplication
      # - diagnostic history
      # - self-healing state
      #
      # to survive between executions.
      #
      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-${{ github.run_id }}

          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-

      # ==========================================================
      # 3. PYTHON
      # ==========================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================================
      # 4. DEPENDENCIES
      # ==========================================================
      - name: Install ATLAS dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          # Core dependencies
          python -m pip install --upgrade ccxt

          # Optional: if requirements.txt exists, install it
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          echo "Installed packages:"
          python -m pip list

      # ==========================================================
      # 5. PREPARE BOT
      # ==========================================================
      - name: Prepare bot.py
        run: |
          set -euo pipefail

          # Check if bot.py exists in repository
          if [ -f bot.py ]; then
            echo "Found bot.py in repository"
          else
            echo "ERROR: bot.py not found in repository"
            echo ""
            echo "Repository contents:"
            ls -la
            echo ""
            echo "Please ensure bot.py is committed to the repository."
            exit 1
          fi

          # Verify we have a valid bot.py
          if ! python -c "import bot" 2>/dev/null; then
            echo "WARNING: bot.py import check failed, but continuing..."
            echo "This may indicate missing dependencies."
          else
            echo "bot.py import check: PASS"
          fi

      # ==========================================================
      # 6. VALIDATE PYTHON
      # ==========================================================
      - name: Validate ATLAS source
        run: |
          set -euo pipefail

          test -f bot.py

          python -m py_compile bot.py

          echo "ATLAS v10.2 Python syntax: PASS"

      # ==========================================================
      # 7. OPTIONAL SMOKE TEST
      # ==========================================================
      #
      # IMPORTANT:
      # Do NOT require a nonexistent v10.2 smoke-test file.
      #
      # If v10.2 smoke test exists -> run it.
      # If v10.3 smoke test exists -> do NOT run it against v10.2
      # because it may assert VERSION == v10.3.
      #
      # Therefore the smoke test is optional here.
      #
      - name: Run ATLAS v10.2 smoke test
        run: |
          set -euo pipefail

          # Check for the correct smoke test file name
          if [ -f atlas_v10_2_smoke_test.py ]; then
            echo "Found ATLAS v10.2 smoke test."
            python atlas_v10_2_smoke_test.py
          elif [ -f atlas_smoke.py ]; then
            echo "Found atlas_smoke.py - checking version compatibility..."
            # Run the smoke test if it's compatible with v10.2
            if grep -q "ATLAS v10.2" atlas_smoke.py; then
              echo "atlas_smoke.py is compatible with v10.2"
              python atlas_smoke.py
            else
              echo "WARNING: atlas_smoke.py version mismatch. Skipping."
              echo "This is not a fatal error - Python compilation already passed."
            fi
          else
            echo "No ATLAS v10.2 smoke test found."
            echo "Skipping optional smoke test."
            echo "Python compilation already passed."
          fi

      # ==========================================================
      # 8. VALIDATE TELEGRAM SECRETS
      # ==========================================================
      - name: Validate Telegram configuration
        run: |
          set -euo pipefail

          # Check that Telegram token is set (required)
          if [ -z "${TELEGRAM_TOKEN}" ]; then
            echo "ERROR: TELEGRAM_TOKEN is not set in secrets"
            exit 1
          fi

          # Check that at least one destination is configured
          if [ -z "${TELEGRAM_CHAT_ID}" ] && [ -z "${TELEGRAM_GROUP_CHAT_ID}" ]; then
            echo "ERROR: Neither TELEGRAM_CHAT_ID nor TELEGRAM_GROUP_CHAT_ID is configured"
            exit 1
          fi

          echo "Telegram configuration: PASS"

      # ==========================================================
      # 9. RUN ATLAS
      # ==========================================================
      - name: Run ATLAS v10.2 Market Supervisor
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ATLAS v10.2 MARKET SUPERVISOR"
          echo "=============================================="
          echo "Python version:"
          python --version
          echo ""
          echo "CCXT version:"
          python -c "import ccxt; print(ccxt.__version__)" || echo "CCXT not found"
          echo ""
          echo "Starting ATLAS analysis..."
          echo "=============================================="

          python bot.py

          echo "=============================================="
          echo "ATLAS v10.2 completed successfully"
          echo "=============================================="

      # ==========================================================
      # 10. INSPECT STATE AFTER RUN
      # ==========================================================
      - name: Inspect ATLAS state
        if: always()
        run: |
          echo "=============================================="
          echo "ATLAS v10.2 STATE AFTER RUN"
          echo "=============================================="

          if [ -f atlas_v102.sqlite3 ]; then
            echo "SQLite database:"
            ls -lh atlas_v102.sqlite3
            echo "Database size: $(du -h atlas_v102.sqlite3 | cut -f1)"
          else
            echo "WARNING: atlas_v102.sqlite3 not created"
          fi

          if [ -f changelog.txt ]; then
            echo ""
            echo "Changelog size:"
            ls -lh changelog.txt
            echo ""
            echo "Last 20 changelog entries:"
            echo "----------------------------------------"
            tail -n 20 changelog.txt
            echo "----------------------------------------"
          else
            echo "WARNING: changelog.txt not created"
          fi

      # ==========================================================
      # 11. SAVE PERSISTENT STATE
      # ==========================================================
      #
      # THIS IS CRITICAL.
      #
      # restore alone is not enough.
      # The current runner's updated SQLite must be saved so the
      # next GitHub Actions runner can restore it.
      #
      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt

          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-${{ github.run_id }}

      # ==========================================================
      # 12. UPLOAD DIAGNOSTICS
      # ==========================================================
      - name: Upload ATLAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.2-diagnostics-${{ github.run_id }}

          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt

          if-no-files-found: ignore
          retention-days: 14

      # ==========================================================
      # 13. HEALTH CHECK (Optional)
      # ==========================================================
      - name: Check ATLAS health
        if: always()
        run: |
          echo "=============================================="
          echo "ATLAS v10.2 HEALTH CHECK"
          echo "=============================================="

          # Check if SQLite file was created/updated
          if [ -f atlas_v102.sqlite3 ]; then
            # Check if file was modified during this run
            MOD_TIME=$(stat -c %Y atlas_v102.sqlite3 2>/dev/null || stat -f %m atlas_v102.sqlite3 2>/dev/null)
            CURRENT_TIME=$(date +%s)
            AGE=$((CURRENT_TIME - MOD_TIME))
            if [ "$AGE" -lt 3600 ]; then
              echo "✅ SQLite database updated within the last hour"
            else
              echo "⚠️  SQLite database may not have been updated (age: ${AGE}s)"
            fi
          else
            echo "❌ SQLite database not found"
          fi

          # Check if changelog was updated
          if [ -f changelog.txt ]; then
            LAST_LINE=$(tail -n 1 changelog.txt 2>/dev/null || echo "")
            if echo "$LAST_LINE" | grep -q "ATLAS v10.2"; then
              echo "✅ Changelog contains ATLAS v10.2 entries"
            else
              echo "⚠️  Changelog may not contain v10.2 entries"
            fi
          fi

name: ATLAS v10.0 Market Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v10
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  atlas:
    name: ATLAS v10.0 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout ATLAS repository
        uses: actions/checkout@v5

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade ccxt

      # =========================================================
      # 4. PREPARE BOT
      # =========================================================
      - name: Prepare ATLAS v10.0 source
        run: |
          if [ -f bot.py ]; then
            echo "Found bot.py"
          elif [ -f AtlasAI_v10_bot.py ]; then
            echo "Found AtlasAI_v10_bot.py; copying to bot.py"
            cp AtlasAI_v10_bot.py bot.py
          elif [ -f ATLAS_bot_v10.py ]; then
            echo "Found ATLAS_bot_v10.py; copying to bot.py"
            cp ATLAS_bot_v10.py bot.py
          else
            echo "ERROR: bot.py is missing."
            ls -la
            exit 1
          fi

      # =========================================================
      # 5. VALIDATE SOURCE
      # =========================================================
      - name: Validate ATLAS v10.0 source
        run: |
          test -f bot.py
          python -m py_compile bot.py
          echo "ATLAS v10.0 syntax: OK"

      # =========================================================
      # 6. RESTORE SQLITE MEMORY
      #
      # IMPORTANT:
      # GitHub runners are ephemeral.
      # Restore previous ATLAS state before execution.
      # =========================================================
      - name: Restore ATLAS SQLite memory
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v10.sqlite3
            atlas_v10.sqlite3-wal
            atlas_v10.sqlite3-shm
          key: atlas-v10-sqlite-${{ github.run_id }}
          restore-keys: |
            atlas-v10-sqlite-

      # =========================================================
      # 7. VERIFY MEMORY STATE
      # =========================================================
      - name: Inspect ATLAS memory
        run: |
          if [ -f atlas_v10.sqlite3 ]; then
            echo "SQLite memory restored successfully."
            ls -lh atlas_v10.sqlite3
          else
            echo "No previous SQLite memory found."
            echo "ATLAS will initialize a new state."
          fi

      # =========================================================
      # 8. SMOKE TEST
      # =========================================================
      - name: Run ATLAS v10 smoke test
        run: |
          if [ -f atlas_v10_smoke_test.py ]; then
            python atlas_v10_smoke_test.py
          elif [ -f atlas_v9_smoke_test.py ]; then
            echo "WARNING: legacy v9 smoke test detected."
            python atlas_v9_smoke_test.py
          else
            echo "No smoke test file present."
          fi

      # =========================================================
      # 9. RUN ATLAS
      # =========================================================
      - name: Run ATLAS v10.0 Market Supervisor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          SUPABASE_URL: "https://tmnfhsuwtqfpglckfxwg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          ATLAS_VERSION: "10.0"
          ATLAS_TIMEFRAME: "4H"

          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

          ATLAS_MIN_CONFIDENCE: "60"
          ATLAS_MAX_LEVERAGE: "10"

          ATLAS_BACKTEST_DAYS: "180"
          ATLAS_SIGNAL_HORIZON_BARS: "36"
          ATLAS_BACKTEST_IMPROVEMENT: "10"
          ATLAS_BACKTEST_REFRESH_HOURS: "24"

          ATLAS_MIN_VOLUME_RATIO: "0.80"
          ATLAS_H4_FALLBACK_MIN_SCORE: "70"

          ATLAS_REQUEST_SLEEP_SECONDS: "0.50"

          ATLAS_CANDLE_EVENT_DEDUP: "1"
          ATLAS_MIN_EXECUTABLE_RR: "2.0"
          ATLAS_MIN_WATCH_CONFIDENCE: "55"

          ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
          ATLAS_SIGNAL_MEMORY_HOURS: "12"

          ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

          ATLAS_SQLITE_FILE: "atlas_v10.sqlite3"
          ATLAS_CHANGELOG: "changelog.txt"

        run: |
          python bot.py

      # =========================================================
      # 10. SAVE SQLITE MEMORY
      #
      # Save after ATLAS finishes.
      # The next run can restore this state.
      # =========================================================
      - name: Save ATLAS SQLite memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v10.sqlite3
            atlas_v10.sqlite3-wal
            atlas_v10.sqlite3-shm
          key: atlas-v10-sqlite-${{ github.run_id }}

      # =========================================================
      # 11. UPLOAD DIAGNOSTICS
      # =========================================================
      - name: Upload ATLAS v10 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10-diagnostics-${{ github.run_id }}
          path: |
            atlas_v10.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

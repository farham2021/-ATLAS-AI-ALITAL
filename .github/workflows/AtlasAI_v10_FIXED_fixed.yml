name: ATLAS v10.1 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # سه اجرای ثابت روزانه
    # UTC
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"

# ============================================================
# جلوگیری از اجرای همزمان دو نسخه ATLAS
# ============================================================
concurrency:
  group: atlas-v101-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  atlas:

    name: ATLAS v10.1 Market Supervisor

    runs-on: ubuntu-latest

    env:

      # ======================================================
      # RUNTIME
      # ======================================================

      PYTHONUNBUFFERED: "1"

      # ======================================================
      # TELEGRAM
      # ======================================================

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ======================================================
      # SUPABASE
      # ======================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ======================================================
      # MARKET DATA
      # ======================================================

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      # ======================================================
      # NEWS / MACRO
      # ======================================================

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      # ======================================================
      # ATLAS CORE
      # ======================================================

      ATLAS_VERSION: "10.1"
      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_WATCH_CONFIDENCE: "55"
      ATLAS_MAX_LEVERAGE: "10"

      # ======================================================
      # BACKTEST
      # ======================================================

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      BACKTEST_REFRESH_HOURS: "24"

      # ======================================================
      # PERSISTENT STATE
      # ======================================================

      ATLAS_SQLITE_FILE: "atlas_v10.1.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            echo "Installing requirements.txt"
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            echo "Installing fallback dependency: ccxt"
            pip install ccxt
          fi


      # ==========================================================
      # 4. VERIFY BOT
      # ==========================================================

      - name: Verify ATLAS bot
        run: |

          echo "========================================"
          echo "ATLAS SOURCE VERIFICATION"
          echo "========================================"

          test -f bot.py

          python -m py_compile bot.py

          echo "bot.py syntax: OK"

          echo ""
          echo "ATLAS version markers:"

          grep -n \
            "ATLAS AI v10.1\|ATLAS v10.1\|ATLAS_VERSION" \
            bot.py | head -10 || true


      # ==========================================================
      # 5. RESTORE PERSISTENT ATLAS STATE
      # ==========================================================
      #
      # IMPORTANT:
      # This MUST happen BEFORE python bot.py.
      #
      # Each run creates an immutable cache entry using run_id.
      # restore-keys retrieves the newest previous state.
      #
      # ==========================================================

      - name: Restore ATLAS persistent state
        id: atlas_restore
        uses: actions/cache/restore@v4
        with:

          path: |
            atlas_v10.1.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-v101-${{ runner.os }}-


      # ==========================================================
      # 6. INSPECT RESTORED STATE
      # ==========================================================

      - name: Inspect restored ATLAS state
        run: |

          echo "========================================"
          echo "ATLAS PERSISTENT STATE"
          echo "========================================"

          if [ -f atlas_v10.1.sqlite3 ]; then
            ls -lh atlas_v10.1.sqlite3
            echo "SQLite state: RESTORED"
          else
            echo "SQLite state: NEW"
          fi

          if [ -f changelog.txt ]; then
            ls -lh changelog.txt
            echo "Changelog: RESTORED"
          else
            echo "Changelog: NEW"
          fi


      # ==========================================================
      # 7. RUN ATLAS
      # ==========================================================

      - name: Run ATLAS v10.1
        run: |

          echo "========================================"
          echo "STARTING ATLAS v10.1"
          echo "========================================"

          python bot.py


      # ==========================================================
      # 8. VERIFY GENERATED STATE
      # ==========================================================

      - name: Verify ATLAS state after run
        if: always()
        run: |

          echo "========================================"
          echo "ATLAS STATE AFTER EXECUTION"
          echo "========================================"

          if [ -f atlas_v10.1.sqlite3 ]; then
            ls -lh atlas_v10.1.sqlite3
            echo "SQLite state: PRESENT"
          else
            echo "WARNING: SQLite state was not created"
          fi

          if [ -f changelog.txt ]; then
            ls -lh changelog.txt
            echo "Changelog: PRESENT"
          else
            echo "WARNING: changelog.txt was not created"
          fi


      # ==========================================================
      # 9. SAVE PERSISTENT ATLAS STATE
      # ==========================================================
      #
      # Cache entries are immutable.
      # Therefore run_id is intentionally part of the key.
      #
      # ==========================================================

      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:

          path: |
            atlas_v10.1.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


      # ==========================================================
      # 10. ARTIFACT BACKUP
      # ==========================================================
      #
      # This is NOT the persistence mechanism.
      # It is only for audit/debugging/manual download.
      #
      # ==========================================================

      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: atlas-v10.1-state-${{ github.run_number }}

          path: |
            atlas_v10.1.sqlite3
            changelog.txt

          if-no-files-found: ignore

          retention-days: 14

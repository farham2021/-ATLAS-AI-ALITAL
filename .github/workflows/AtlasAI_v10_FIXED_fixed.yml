name: ATLAS v10.1 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # سه اجرای ثابت روزانه
    # UTC — معادل زمان‌های تعیین‌شده ATLAS
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  atlas:
    name: ATLAS v10.1 Market Supervisor
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      ATLAS_VERSION: "10.1"
      ATLAS_TIMEFRAME: "4H"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_WATCH_CONFIDENCE: "55"
      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      BACKTEST_REFRESH_HOURS: "24"

      ATLAS_SQLITE_FILE: "atlas_v10.1.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install ccxt
          fi


      # ==========================================================
      # 4. VERIFY BOT
      # ==========================================================
      - name: Verify ATLAS bot
        run: |
          test -f bot.py
          python -m py_compile bot.py

          echo "========================================"
          echo "ATLAS source verification"
          echo "========================================"

          grep -n "ATLAS AI v10.1\|ATLAS v10.1" bot.py | head -5 || true

          echo "bot.py syntax OK"


      # ==========================================================
      # 5. RESTORE PERSISTENT ATLAS STATE
      # ==========================================================
      #
      # IMPORTANT:
      # This MUST happen BEFORE python bot.py.
      #
      # The run_id makes every SAVE key unique.
      # restore-keys allows the next run to recover
      # the most recent previous ATLAS state.
      #
      # ==========================================================
      - name: Restore ATLAS persistent state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v10.1.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

          restore-keys: |
            atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-
            atlas-state-v101-${{ runner.os }}-


      # ==========================================================
      # 6. SHOW RESTORED STATE
      # ==========================================================
      - name: Inspect restored ATLAS state
        run: |
          echo "========================================"
          echo "ATLAS persistent state"
          echo "========================================"

          if [ -f atlas_v10.1.sqlite3 ]; then
            ls -lh atlas_v10.1.sqlite3
            echo "SQLite state: RESTORED"
          else
            echo "SQLite state: NEW"
          fi

          if [ -f changelog.txt ]; then
            ls -lh changelog.txt
            echo "Changelog: RESTORED"
          else
            echo "Changelog: NEW"
          fi


      # ==========================================================
      # 7. RUN ATLAS
      # ==========================================================
      - name: Run ATLAS v10.1
        run: |
          echo "========================================"
          echo "STARTING ATLAS v10.1"
          echo "========================================"

          python bot.py


      # ==========================================================
      # 8. VERIFY GENERATED STATE
      # ==========================================================
      - name: Verify ATLAS state after run
        if: always()
        run: |
          echo "========================================"
          echo "ATLAS state after execution"
          echo "========================================"

          if [ -f atlas_v10.1.sqlite3 ]; then
            ls -lh atlas_v10.1.sqlite3
            echo "SQLite state: PRESENT"
          else
            echo "WARNING: SQLite state was not created"
          fi

          if [ -f changelog.txt ]; then
            ls -lh changelog.txt
            echo "Changelog: PRESENT"
          else
            echo "WARNING: changelog.txt was not created"
          fi


      # ==========================================================
      # 9. SAVE PERSISTENT ATLAS STATE
      # ==========================================================
      #
      # MUST happen AFTER bot.py.
      #
      # Because cache entries are immutable, we use github.run_id
      # in the key and restore the newest previous entry by prefix.
      #
      # ==========================================================
      - name: Save ATLAS persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v10.1.sqlite3
            changelog.txt

          key: atlas-state-v101-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}


      # ==========================================================
      # 10. OPTIONAL ARTIFACT BACKUP
      # ==========================================================
      #
      # This is NOT the primary persistence mechanism.
      # It is only for debugging/audit/download.
      #
      # ==========================================================
      - name: Upload ATLAS state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.1-state-${{ github.run_number }}
          path: |
            atlas_v10.1.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

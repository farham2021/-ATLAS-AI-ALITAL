name: AtlasAI v8.1 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    # هر 4 ساعت
    - cron: "0 */4 * * *"

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  atlas:
    name: ATLAS v8.1 Market Supervisor
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout ATLAS repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================================================
      # 3. Install dependencies
      # =========================================================
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ccxt

      # =========================================================
      # 4. Validate bot.py
      # =========================================================
      - name: Validate ATLAS source
        run: |
          python -m py_compile bot.py
          echo "ATLAS bot.py syntax check: OK"

      # =========================================================
      # 5. Run ATLAS v8.1
      # =========================================================
      - name: Run ATLAS v8.1 Market Supervisor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

          ATLAS_VERSION: "8.1"
          ATLAS_TIMEFRAME: "4H"

        run: |
          python bot.py

      # =========================================================
      # 6. Upload ATLAS learning database/logs
      # =========================================================
      - name: Upload ATLAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v8-1-diagnostics
          path: |
            atlas.db
            atlas_signals.csv
            changelog.txt
            atlas_backtest.json
          if-no-files-found: ignore
          retention-days: 14

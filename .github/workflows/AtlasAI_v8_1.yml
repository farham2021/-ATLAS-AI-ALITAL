name: ATLAS v8.1 Market Supervisor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: atlas-v8-1
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  atlas:
    name: ATLAS v8.1 Market Supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout ATLAS repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # =========================================================
      # 3. Upgrade pip
      # =========================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # =========================================================
      # 4. Install ATLAS dependencies
      # =========================================================
      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade ccxt

      # =========================================================
      # 5. Verify Python environment
      # =========================================================
      - name: Verify Python environment
        run: |
          python --version
          pip --version
          python -c "import ccxt; print('CCXT:', ccxt.__version__)"

      # =========================================================
      # 6. Verify ATLAS source
      # =========================================================
      - name: Validate ATLAS source
        run: |
          test -f bot.py
          python -m py_compile bot.py
          echo "ATLAS bot.py syntax: OK"

      # =========================================================
      # 7. Run ATLAS v8.1
      # =========================================================
      - name: Run ATLAS v8.1 Market Supervisor
        env:

          # -----------------------------------------------------
          # Telegram
          # -----------------------------------------------------
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          # -----------------------------------------------------
          # Market / Crypto APIs
          # -----------------------------------------------------
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

          # -----------------------------------------------------
          # Macro / Metals / News
          # -----------------------------------------------------
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

          # -----------------------------------------------------
          # ATLAS configuration
          # -----------------------------------------------------
          ATLAS_VERSION: "8.1"
          ATLAS_TIMEFRAME: "4H"

          # Capital protection
          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "3.0"

        run: |
          python bot.py

      # =========================================================
      # 8. Upload diagnostics
      # =========================================================
      - name: Upload ATLAS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-v8-1-diagnostics
          path: |
            atlas.db
            atlas_signals.csv
            changelog.txt
            atlas_backtest.json
            atlas_report.txt
          if-no-files-found: ignore
          retention-days: 14

name: ATLAS AI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

jobs:
  run-atlas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ATLAS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python bot.py

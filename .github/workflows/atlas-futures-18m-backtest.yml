name: ATLAS Futures 18M Research Backtest
on:
  push:
    branches: [main, codex/atlas-perp-timesfm-shadow]
    paths:
      - 'atlas_futures_v2.py'
      - 'atlas_futures_backtest_18m.py'
      - 'atlas_perp_data_and_oos.py'
      - 'atlas_timesfm_shadow.py'
      - 'ATLAS_ARCHITECTURE_AND_RULES.md'
      - 'test_atlas_futures_backtest_18m.py'
      - '.github/workflows/atlas-futures-18m-backtest.yml'
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated linear perpetual symbols"
        required: true
        default: "BTC,ETH,SOL"
      months:
        description: "Historical months (12-24)"
        required: true
        default: "18"
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      accepted: ${{ steps.acceptance.outputs.accepted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate research modules
        run: python -m unittest -v test_atlas_futures_costs.py test_atlas_futures_v2_diagnostics.py test_atlas_futures_backtest_18m.py
      - name: Download perpetual history and evaluate fixed OOS windows
        env:
          SYMBOLS: ${{ inputs.symbols || 'BTC,ETH,SOL' }}
          MONTHS: ${{ inputs.months || '18' }}
        run: python atlas_futures_backtest_18m.py --symbols "$SYMBOLS" --months "$MONTHS"
      - id: acceptance
        if: always()
        run: |
          if [ -f atlas_backtest_results/summary.json ]; then
            python -c "import json; print('accepted=' + str(json.load(open('atlas_backtest_results/summary.json')).get('verdict') == 'EMPIRICAL_RESEARCH_COMPLETE').lower())" >> "$GITHUB_OUTPUT"
          else
            echo "accepted=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-futures-18m-research
          path: atlas_backtest_results/
          if-no-files-found: warn

  timesfm-shadow:
    needs: baseline
    if: needs.baseline.result == 'success' && needs.baseline.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: atlas-futures-18m-research
          path: atlas_backtest_results/
      - name: Install optional TimesFM 2.5 CPU dependencies
        run: python -m pip install --upgrade "timesfm[torch]"
      - name: Compare TimesFM and Random Walk in shadow mode
        run: python atlas_timesfm_shadow.py --baseline atlas_backtest_results/summary.json --data-dir atlas_backtest_results/data --out atlas_timesfm_shadow_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-timesfm-shadow
          path: atlas_timesfm_shadow_results/
          if-no-files-found: warn

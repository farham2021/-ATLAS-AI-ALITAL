name: ATLAS Futures V2 Canonical Shadow
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-futures-v2-shadow
  cancel-in-progress: false
jobs:
  calculate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute canonical 4H setups and audit closed candles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python atlas_futures_v2.py

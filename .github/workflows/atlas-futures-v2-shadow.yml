name: ATLAS Futures V2 Canonical Shadow
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      telegram_diagnostic:
        description: "Send one explicit transport-test message to private and group Telegram"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: atlas-futures-v2-shadow
  cancel-in-progress: false
jobs:
  calculate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical diagnostics
        run: python -m unittest -v test_atlas_futures_v2_diagnostics.py
      - name: Compute canonical 4H setups and audit closed candles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          ATLAS_V2_TELEGRAM: "1"
          ATLAS_V2_MAX_REFRESH: "100"
          ATLAS_V2_TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_diagnostic && '1' || '0' }}
        run: python atlas_futures_v2.py

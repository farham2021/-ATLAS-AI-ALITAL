name: ATLAS Paper Trade Setups
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setups:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG renderer
        run: python -m pip install matplotlib==3.9.4
      - name: Generate paper-only BUY SELL WATCH WAIT with TP SL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATLAS_PAPER_TELEGRAM: '1'
        run: python atlas_paper_trade_setups.py

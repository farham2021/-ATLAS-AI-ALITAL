name: ATLAS PNG Futures PR Validation
on:
  pull_request:
    paths:
      - atlas_futures_png.py
      - atlas_futures_evidence.py
      - test_atlas_futures_evidence.py
      - test_atlas_futures_png.py
      - atlas_cross_asset_png.py
      - atlas_conditional_opportunities.py
      - test_atlas_conditional_opportunities.py
      - test_atlas_cross_asset_png.py
      - bot.py
      - .github/workflows/atlas-png-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependency
        run: python -m pip install matplotlib
      - name: Compile changed modules
        run: python -m py_compile atlas_futures_evidence.py test_atlas_futures_evidence.py atlas_futures_png.py atlas_cross_asset_png.py atlas_conditional_opportunities.py bot.py test_atlas_futures_png.py test_atlas_cross_asset_png.py test_atlas_conditional_opportunities.py
      - name: Validate trade gates and actual PNG bytes
        run: python -m unittest -v test_atlas_futures_evidence.py test_atlas_futures_png.py test_atlas_cross_asset_png.py test_atlas_conditional_opportunities.py

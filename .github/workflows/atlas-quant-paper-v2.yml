name: ATLAS Quant and Paper V2 Tests
on:
  push:
    branches: [main]
    paths:
      - 'atlas_quant_risk_v2.py'
      - 'atlas_paper_replay_journal_v2.py'
      - 'atlas_paper_execution_v2.py'
      - 'test_atlas_research_v2.py'
      - '.github/workflows/atlas-quant-paper-v2.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_atlas_paper_execution_v2.py test_atlas_research_v2.py

name: ATLAS Quant Risk V4 JavaScript Tests
on:
  push:
    branches: [main]
    paths:
      - 'web/atlas_quant_risk_v4.mjs'
      - 'web/test_atlas_quant_risk_v4.mjs'
      - '.github/workflows/atlas-quant-v4-js.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/test_atlas_quant_risk_v4.mjs

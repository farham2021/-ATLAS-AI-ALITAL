name: ATLAS Shadow Signal Validation
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'
permissions:
  contents: read
jobs:
  shadow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only forward outcome validation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python atlas_shadow_validation.py

name: ATLAS Telegram Delivery Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify receipt helper
        run: |
          python -m unittest -v test_atlas_telegram_receipts.py
          python -m py_compile atlas_telegram_receipts.py atlas_telegram_delivery_test.py
      - name: Send harmless private and group diagnostics and verify receipts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python atlas_telegram_delivery_test.py

name: ATLAS Unified Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'web/*.mjs'
      - '.github/workflows/atlas-unified-tests.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'web/*.mjs'
      - '.github/workflows/atlas-unified-tests.yml'

permissions:
  contents: read

concurrency:
  group: atlas-unified-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run all pytest-discoverable tests
        run: python -m pytest -q --junitxml=python-test-results.xml
      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-python-test-results
          path: python-test-results.xml
          if-no-files-found: ignore

  javascript:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node unit suites (browser smoke stays in dedicated E2E workflows)
        run: |
          node --test tests/*.test.cjs web/test_atlas_quant_risk_v4.mjs

# Existing production, shadow, browser E2E and data-backfill workflows are
# intentionally retained: they have distinct secrets, schedules and side effects.
# Consolidation here means one entry point for offline unit tests, not deletion
# of unique tests or migration of scheduled operational jobs.

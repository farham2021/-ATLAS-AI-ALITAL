name: ATLAS Web E2E Smoke (desktop + mobile)
on:
  workflow_dispatch:
  push:
    paths:
      - docs/index.html
      - docs/trading-lab.html
      - tests/atlas-web-smoke.cjs
      - tests/atlas-quant-core.test.cjs
      - research/quant-core.cjs
      - research/atlas-intelligence.cjs
      - tests/atlas-intelligence.test.cjs
      - research/atlas-risk-validation.cjs
      - tests/atlas-risk-validation.test.cjs
      - .github/workflows/atlas-web-e2e.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trading lab safety and static syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('docs/trading-lab.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('missing trading lab script');
          new Function(script);
          if(!html.includes('Simulation only')||!html.includes('last closed candle'))throw Error('paper trading disclosure missing');
          if(!fs.readFileSync('docs/index.html','utf8').includes('./trading-lab.html'))throw Error('trading lab not linked');
          NODE
      - name: Quantitative engine unit tests (no live trading)
        run: node --test tests/atlas-quant-core.test.cjs tests/atlas-intelligence.test.cjs tests/atlas-risk-validation.test.cjs
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Serve checked-out PWA (avoid GitHub Pages deployment race)
        run: python3 -m http.server 8765 --directory docs > /tmp/atlas-web-http.log 2>&1 &
      - name: Browser smoke on exact commit
        env:
          ATLAS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/atlas-web-smoke.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-web-smoke-screenshots
          path: atlas-*.png
          if-no-files-found: ignore

name: ATLAS Web Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'atlas-dashboard.html'
      - 'atlas_macro_events.py'
      - atlas_coinglass_snapshot.py
      - assets/atlas-coinglass-widget.js
      - '.github/workflows/atlas-web-pages.yml'
      - '.github/workflows/publish-atlas-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare combined static site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/desk
          cp atlas-dashboard.html _site/index.html
          cp atlas-dashboard.html _site/atlas-dashboard.html
          cp -a assets/. _site/assets/
          cp -a docs/. _site/desk/
          printf '%s\n' '<!doctype html><title>ATLAS</title><a href="./">ATLAS Dashboard</a>' > _site/404.html
      - name: Generate fail-closed Kalshi event snapshot
        run: python atlas_macro_events.py --output _site/macro_events.json
      - name: Generate fail-closed CoinGlass derivatives snapshot
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python atlas_coinglass_snapshot.py _site/coinglass_snapshot.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact API visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['GITHUB_RUN_ID']
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                      artifacts = json.load(response).get('artifacts', [])
                  if any(a.get('name') == 'github-pages' and not a.get('expired') for a in artifacts):
                      print('github-pages artifact visible through Actions API')
                      break
                  print(f'Artifact not visible yet ({attempt + 1}/18)')
              except Exception as exc:
                  print(f'Artifact lookup temporarily failed: {exc}')
              time.sleep(10)
          else:
              raise SystemExit('Pages artifact unavailable through Actions API; refusing premature deploy')
          PY
      - id: deployment
        uses: actions/deploy-pages@v4

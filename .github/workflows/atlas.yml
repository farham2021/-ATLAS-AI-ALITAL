# ============================================================
# ATLAS AI v11.5 — GitHub Actions workflow
# ============================================================
# مسیر صحیح این فایل در ریپوی شما: .github/workflows/atlas.yml
#
# منطق زمان‌بندی داخل خود اسکریپت است (_automatic_run_plan): با
# ATLAS_RUN_MODE=AUTO، اسکریپت بر اساس ساعت تهران خودش تصمیم می‌گیرد که
# analysis (هر ۴ ساعت) و/یا snapshot (هر ۳ ساعت) اجرا شود یا نه. پس این
# workflow فقط باید هر ساعت اسکریپت را صدا بزند؛ خود اسکریپت باقی را
# تشخیص می‌دهد.
#
# ⚠️ محدودیت شناخته‌شده‌ی GitHub Actions (نه باگ این کد): زمان‌بندی
# cron در GH Actions "بهترین تلاش" است، نه دقیق‌به‌دقیقه — در بارهای
# سنگین ممکن است چند دقیقه دیر اجرا شود. اگر یک اجرا کامل جا بیفتد
# (نه فقط دیر شود)، همان ساعت آنالیز/اسنپ‌شات آن بازه از دست می‌رود؛
# اسکریپت آن را عقب‌گرد نمی‌کند.
# ============================================================

name: ATLAS AI Bot

on:
  schedule:
    # هر ساعت، در دقیقه‌ی ۵ (کمی فاصله از ابتدای ساعت تا صف اجرای GH Actions خالی‌تر باشد)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "اجرای دستی: override برای ATLAS_RUN_MODE (خالی = استفاده از AUTO)"
        required: false
        default: ""

concurrency:
  # اگر اجرای قبلی هنوز تمام نشده، اجرای جدید صف بایستد نه هم‌زمان اجرا شود —
  # از رقابت روی همان ردیف‌های SQLite/Supabase جلوگیری می‌کند.
  group: atlas-bot
  cancel-in-progress: false

jobs:
  run-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATLAS
        env:
          # override دستی (اگر از workflow_dispatch با run_mode پر شده باشد)
          ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'AUTO' }}
          ATLAS_ENGINE: BOTH

          # --- Telegram ---
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          # --- Supabase ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          # --- APIهای اختیاری (هرکدام نبود، فقط همان منبع غیرفعال می‌شود) ---
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          # --- خروجی‌ها ---
          ATLAS_ENABLE_IMAGE_TABLE: "true"
          ATLAS_ENABLE_VOICE: "true"
          ATLAS_AUTO_SEND_VOICE: "true"

        run: python bot.py   # ✅ نام فایل اصلاح شد

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-failure-log-${{ github.run_id }}
          path: |
            *.log
            atlas_changelog.jsonl
          if-no-files-found: ignore

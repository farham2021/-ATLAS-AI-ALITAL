name: ATLAS AI Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt matplotlib
          
      - name: Run ATLAS AI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          
          # ✅ اجرای BOTH (MARKET + PERSONAL)
          ATLAS_RUN_MODE: "ANALYSIS"
          ATLAS_ENGINE: "BOTH"
          
          # غیرفعال کردن ویژگی‌های سنگین برای سرعت
          ATLAS_ENABLE_IMAGE_TABLE: "0"
          ATLAS_ENABLE_VOICE: "0"
          ATLAS_AUTO_SEND_VOICE: "0"
          ATLAS_CANDLE_EVENT_DEDUP: "0"
          
          # کاهش آستانه‌ها برای تولید سیگنال
          ATLAS_MIN_CONFIDENCE: "35"
          ATLAS_MIN_EXECUTABLE_RR: "1.0"
          ATLAS_MIN_VOLUME_RATIO: "0.3"
          
          # API Key ها (اختیاری)
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          
        run: |
          echo "🚀 Starting ATLAS AI with BOTH engines..."
          echo "📊 MARKET + PERSONAL portfolio analysis"
          python bot.py
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reports
          path: |
            *.csv
            *.png
            changelog.txt
            atlas_v11.sqlite3

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy
        run: |
          echo "✅ ATLAS AI deployed successfully!"
          echo "📊 Both MARKET and PERSONAL reports sent to Telegram"
          echo "📎 CSV file generated"

# ============================================================
# ATLAS AI v11.5 / Phase 3.5.1
# Smart Hourly Surveillance + Notification Hotfix
# ============================================================

name: ATLAS AI Smart Hourly Surveillance

on:
  schedule:
    # Run every hour at minute 30 UTC
    - cron: "30 * * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "ATLAS execution mode"
        required: true
        default: "ANALYSIS"
        type: choice
        options:
          - ANALYSIS
          - SNAPSHOT
          - BOTH

      delivery_mode:
        description: "Telegram/report delivery mode"
        required: true
        default: "FULL"
        type: choice
        options:
          - FULL
          - ALERTS_ONLY

permissions:
  contents: read

concurrency:
  group: atlas-bot
  cancel-in-progress: false

jobs:
  run-atlas:
    name: Run ATLAS AI
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ========================================================
      # 1. Checkout
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. Python
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ========================================================
      # 3. Dependencies
      # ========================================================
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================================
      # 4. Resolve execution / delivery mode
      #
      # Scheduled:
      #   Every 4 hours = BOTH + FULL
      #   Other hours   = ANALYSIS + ALERTS_ONLY
      #
      # Manual:
      #   Uses selections from workflow_dispatch
      # ========================================================
      - name: Select ATLAS execution mode
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "ATLAS_RUN_MODE_RESOLVED=${{ inputs.run_mode }}" >> "$GITHUB_ENV"
            echo "ATLAS_DELIVERY_MODE=${{ inputs.delivery_mode }}" >> "$GITHUB_ENV"

          else

            HOUR=$(date -u +%H)

            if (( 10#$HOUR % 4 == 0 )); then

              # 00:30 / 04:30 / 08:30 / 12:30 / 16:30 / 20:30 UTC
              # Full analysis + Snapshot + all reports

              echo "ATLAS_RUN_MODE_RESOLVED=BOTH" >> "$GITHUB_ENV"
              echo "ATLAS_DELIVERY_MODE=FULL" >> "$GITHUB_ENV"

            else

              # Hourly surveillance
              # Full analytical pipeline still runs.
              # Only smart/meaningful alerts are delivered.

              echo "ATLAS_RUN_MODE_RESOLVED=ANALYSIS" >> "$GITHUB_ENV"
              echo "ATLAS_DELIVERY_MODE=ALERTS_ONLY" >> "$GITHUB_ENV"

            fi
          fi

      # ========================================================
      # 5. Safe diagnostics
      # Never print secrets
      # ========================================================
      - name: Show ATLAS configuration
        env:
          ATLAS_ENGINE: "BOTH"
          ATLAS_SCHEDULED_CADENCE: "workflow"
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS AI v11.5 / Phase 3.5.1"
          echo "=================================================="
          echo "Run mode: ${ATLAS_RUN_MODE_RESOLVED}"
          echo "Delivery mode: ${ATLAS_DELIVERY_MODE}"
          echo "Engine: ${ATLAS_ENGINE}"
          echo "Cadence: ${ATLAS_SCHEDULED_CADENCE}"
          echo "GitHub event: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "UTC time: $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "=================================================="

      # ========================================================
      # 6. Run ATLAS
      # ========================================================
      - name: Run ATLAS
        env:

          # ----------------------------------------------------
          # Core
          # ----------------------------------------------------
          PYTHONUNBUFFERED: "1"

          ATLAS_VERSION: "11.5"
          ATLAS_ENGINE: "BOTH"

          ATLAS_SCHEDULED_CADENCE: "workflow"

          ATLAS_RUN_MODE: ${{ env.ATLAS_RUN_MODE_RESOLVED }}
          ATLAS_DELIVERY_MODE: ${{ env.ATLAS_DELIVERY_MODE }}

          ATLAS_TIMEFRAME: "4H"

          # ----------------------------------------------------
          # Performance
          # ----------------------------------------------------
          ATLAS_ANALYSIS_WORKERS: "3"
          ATLAS_EXCHANGE_MAX_CONCURRENCY: "2"
          ATLAS_PREFETCH_EXCHANGE_WORKERS: "3"

          # Ephemeral GitHub runner:
          # SQLite OHLCV hot-path intentionally disabled.
          ATLAS_SQLITE_OHLCV_CACHE_ENABLED: "0"

          # Supabase persistent closed-candle cache
          ATLAS_PERSISTENT_CLOSED_OHLCV: "1"

          # ----------------------------------------------------
          # TradingView
          # ----------------------------------------------------
          ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"
          ATLAS_TRADINGVIEW_INTERVAL: "240"

          TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}

          # ----------------------------------------------------
          # Snapshot
          # ----------------------------------------------------
          ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: "0.05"

          # ----------------------------------------------------
          # Risk Management
          # ----------------------------------------------------
          RISK_PER_TRADE_PCT: "1.5"

          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

          ATLAS_MAX_LEVERAGE: "10"

          # ----------------------------------------------------
          # Canonical Signal Thresholds
          # ----------------------------------------------------
          ATLAS_MIN_CONFIDENCE: "55"

          ATLAS_MIN_WATCH_CONFIDENCE: "45"

          ATLAS_MIN_EXECUTABLE_RR: "1.5"

          ATLAS_MIN_VOLUME_RATIO: "0.60"

          ATLAS_TRADE_GEOMETRY_EPSILON: "1e-12"

          ATLAS_H4_FALLBACK_MIN_SCORE: "60"

          # ----------------------------------------------------
          # Smart Notification Threshold
          #
          # IMPORTANT:
          # This only controls Telegram notification filtering.
          # It does NOT modify canonical BUY/SELL/WAIT,
          # Entry, SL, TP, Evidence, MTF or Decision Engine.
          # ----------------------------------------------------
          ATLAS_NOTIFICATION_MIN_SCORE: "68"

          # ----------------------------------------------------
          # Backtest
          # ----------------------------------------------------
          ATLAS_BACKTEST_DAYS: "180"

          ATLAS_SIGNAL_HORIZON_BARS: "36"

          ATLAS_BACKTEST_IMPROVEMENT: "10"

          ATLAS_BACKTEST_REFRESH_HOURS: "24"

          # ----------------------------------------------------
          # Free Alert Engine
          # ----------------------------------------------------
          ATLAS_CANDLE_EVENT_DEDUP: "1"

          ATLAS_FREE_ALERTS_ENABLED: "1"

          # Canonical variable used by the bot
          ATLAS_FREE_ALERT_SEND_INFO: "0"

          # Compatibility alias
          ATLAS_FREE_ALERT_INFO_TELEGRAM: "0"

          ATLAS_FREE_ALERT_BATCH_SIZE: "12"

          # ----------------------------------------------------
          # Local Storage
          # ----------------------------------------------------
          ATLAS_SQLITE_FILE: "atlas_v11.sqlite3"

          ATLAS_CHANGELOG: "changelog.txt"

          # ----------------------------------------------------
          # Telegram
          # ----------------------------------------------------
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          # ----------------------------------------------------
          # Supabase
          #
          # SECURITY:
          # anon key only.
          # No service-role key in GitHub Actions.
          # ----------------------------------------------------
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          # ----------------------------------------------------
          # Market APIs
          # ----------------------------------------------------
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          # ----------------------------------------------------
          # News / Sentiment
          # ----------------------------------------------------
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

          # ----------------------------------------------------
          # Other APIs
          # ----------------------------------------------------
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

          # ----------------------------------------------------
          # Voice Report
          # FULL delivery only
          # ----------------------------------------------------
          ATLAS_ENABLE_VOICE: "1"

          ATLAS_VOICE_TYPE: "female"

          ATLAS_VOICE_LANGUAGE: "fa"

          ATLAS_AUTO_SEND_VOICE: "1"

          # ----------------------------------------------------
          # PNG Report
          # FULL delivery only
          # ----------------------------------------------------
          ATLAS_ENABLE_IMAGE_TABLE: "1"

        run: |
          set -euo pipefail

          python bot.py

      # ========================================================
      # 7. Failure diagnostics
      # ========================================================
      - name: Upload ATLAS logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-failure-log-${{ github.run_id }}

          path: |
            *.log
            *.txt
            atlas_changelog.jsonl
            changelog.txt
            atlas_v11.sqlite3

          if-no-files-found: ignore

          retention-days: 7

      # ========================================================
      # 8. Success marker
      # ========================================================
      - name: ATLAS completed
        if: success()
        run: |
          echo "=================================================="
          echo "ATLAS AI completed successfully"
          echo "=================================================="
          echo "Event: ${{ github.event_name }}"
          echo "Run mode: ${ATLAS_RUN_MODE_RESOLVED}"
          echo "Delivery mode: ${ATLAS_DELIVERY_MODE}"
          echo ""
          echo "Schedule architecture:"
          echo "  Hourly surveillance:"
          echo "    ANALYSIS + ALERTS_ONLY"
          echo ""
          echo "  Every 4 hours:"
          echo "    BOTH + FULL"
          echo ""
          echo "Phase 3.5.1:"
          echo "  Smart hourly notifications enabled"
          echo "  Notification minimum score: 68"
          echo "  Parallel ticker prefetch enabled"
          echo "  Persistent closed OHLCV enabled"
          echo "  Supabase persistence enabled"
          echo "  Legacy CSV preserved"
          echo "  PNG preserved"
          echo "  Voice preserved"
          echo "  Snapshot preserved"
          echo "=================================================="

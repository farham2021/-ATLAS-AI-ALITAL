# ============================================================
# ATLAS AI v11.5 — GitHub Actions workflow
# ============================================================
# مسیر صحیح این فایل در ریپوی شما: .github/workflows/atlas.yml
#
# زمان‌بندی: هر ۶ ساعت یک بار در دقیقه ۳۰ UTC اجرا می‌شود.
# با ATLAS_RUN_MODE=BOTH، اسکریپت همیشه تحلیل و اسنپ‌شات را
# با هم اجرا می‌کند و گزارش کامل ارسال می‌شود.
# ============================================================

name: ATLAS AI Bot

on:
  schedule:
    # هر ۶ ساعت در دقیقه ۳۰ UTC (ساعت‌های ۰:۳۰، ۶:۳۰، ۱۲:۳۰، ۱۸:۳۰)
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "حالت اجرا"
        required: true
        default: "BOTH"
        type: choice
        options:
          - ANALYSIS
          - SNAPSHOT
          - BOTH

concurrency:
  group: atlas-bot
  cancel-in-progress: false

jobs:
  run-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATLAS
        env:
          ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'BOTH' }}
          ATLAS_ENGINE: BOTH

          # --- Telegram ---
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

          # --- Supabase ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          # --- APIهای اختیاری ---
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

          # --- خروجی‌ها ---
          ATLAS_ENABLE_IMAGE_TABLE: "true"
          ATLAS_ENABLE_VOICE: "true"
          ATLAS_AUTO_SEND_VOICE: "true"

        run: python bot.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-failure-log-${{ github.run_id }}
          path: |
            *.log
            atlas_changelog.jsonl
          if-no-files-found: ignore

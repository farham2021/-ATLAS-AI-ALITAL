name: ATLAS AI v10.2 — Two Engine Corrected

on:
  workflow_dispatch:
  schedule:
    # MARKET: every 4 hours UTC
    - cron: "0 */4 * * *"
    # PERSONAL: 08:30 Tehran = 05:00 UTC
    - cron: "0 5 * * *"
    # PERSONAL: 23:00 Tehran = 19:30 UTC
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-two-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      ATLAS_VERSION: "10.2-two-engine-v3"
      ATLAS_TIMEFRAME: "4H"
      ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"
      ATLAS_TRADINGVIEW_INTERVAL: "240"
      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MAX_LEVERAGE: "10"
      ATLAS_MIN_EXECUTABLE_RR: "2.0"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"
      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"
      ATLAS_CANDLE_EVENT_DEDUP: "1"
      ATLAS_SQLITE_FILE: "atlas_v102.sqlite3"
      ATLAS_CHANGELOG: "changelog.txt"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade ccxt

      - name: Restore persistent ATLAS state
        uses: actions/cache/restore@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-v3-v3-${{ github.run_number }}
          restore-keys: |
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-
            atlas-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Verify files
        run: |
          set -euo pipefail
          test -f bot.py
          test -f smoke_atlas.py
          python -m py_compile bot.py
          python -m py_compile smoke_atlas.py

      - name: Run smoke test
        run: |
          set -euo pipefail
          python smoke_atlas.py

      - name: Validate Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID" || test -n "$TELEGRAM_GROUP_CHAT_ID"

      - name: Run ATLAS engine
        run: |
          set -euo pipefail
          # Two independent engines share one analysis snapshot:
          # MARKET = 4H market radar; PERSONAL = full portfolio + metals.
          # The daily Tehran windows run PERSONAL; the 4H cadence runs MARKET.
          # Manual dispatch can set ATLAS_ENGINE=MARKET/PERSONAL/BOTH in the repository variable.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${ATLAS_ENGINE:-}" ]; then
            echo "ATLAS_ENGINE=${ATLAS_ENGINE}"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ] || [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then
            export ATLAS_ENGINE=PERSONAL
            echo "ATLAS_ENGINE=PERSONAL"
          else
            export ATLAS_ENGINE=MARKET
            echo "ATLAS_ENGINE=MARKET"
          fi
          python bot.py

      - name: Finalize SQLite
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$ATLAS_SQLITE_FILE" ]; then
            python - <<'PY'
          import os, sqlite3
          db=os.environ.get("ATLAS_SQLITE_FILE","atlas_v102.sqlite3")
          con=sqlite3.connect(db, timeout=30)
          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA optimize")
              ok=con.execute("PRAGMA integrity_check").fetchone()
              print("SQLite integrity:", ok[0] if ok else "UNKNOWN")
              if not ok or ok[0] != "ok": raise SystemExit(1)
          finally:
              con.close()
          PY
          fi

      - name: Save persistent ATLAS state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            atlas_v102.sqlite3
            atlas_v102.sqlite3-wal
            atlas_v102.sqlite3-shm
            changelog.txt
          key: atlas-state-${{ runner.os }}-${{ github.ref_name }}-v10.2-v3-${{ github.run_number }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v10.2-corrected-${{ github.run_id }}
          path: |
            atlas_v102.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

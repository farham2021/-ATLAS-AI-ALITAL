name: ATLAS AI Bot v11

on:
  schedule:
    # اجرا هر 4 ساعت یکبار
    - cron: '0 */4 * * *'
  # اجرای دستی از دکمه Actions
  workflow_dispatch:

jobs:
  run-atlas:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ccxt edge-tts gtts matplotlib
      
      - name: Run ATLAS Bot
        env:
          # ===== Telegram (Secrets) =====
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          
          # ===== Supabase (Secret) =====
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # ===== API Keys (Secrets) =====
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          
          # ===== ATLAS Runtime Settings (Variables) =====
          ATLAS_RUN_MODE: ${{ vars.ATLAS_RUN_MODE }}
          ATLAS_ENGINE: ${{ vars.ATLAS_ENGINE }}
          
          # ===== ATLAS Voice Settings (Variables) =====
          ATLAS_ENABLE_VOICE: ${{ vars.ATLAS_ENABLE_VOICE }}
          ATLAS_AUTO_SEND_VOICE: ${{ vars.ATLAS_AUTO_SEND_VOICE }}
          ATLAS_VOICE_TYPE: ${{ vars.ATLAS_VOICE_TYPE }}
          ATLAS_VOICE_LANGUAGE: ${{ vars.ATLAS_VOICE_LANGUAGE }}
          
          # ===== ATLAS Image Settings (Variables) =====
          ATLAS_ENABLE_IMAGE_TABLE: ${{ vars.ATLAS_ENABLE_IMAGE_TABLE }}
          
          # ===== ATLAS Trading Settings (Variables) =====
          ATLAS_MIN_CONFIDENCE: ${{ vars.ATLAS_MIN_CONFIDENCE }}
          ATLAS_MIN_EXECUTABLE_RR: ${{ vars.ATLAS_MIN_EXECUTABLE_RR }}
          ATLAS_MIN_VOLUME_RATIO: ${{ vars.ATLAS_MIN_VOLUME_RATIO }}
          ATLAS_MAX_LEVERAGE: ${{ vars.ATLAS_MAX_LEVERAGE }}
          ATLAS_BACKTEST_DAYS: ${{ vars.ATLAS_BACKTEST_DAYS }}
          
          # ===== Telegram Rate Limits (Variables) =====
          TELEGRAM_PRIVATE_DELAY: ${{ vars.TELEGRAM_PRIVATE_DELAY }}
          TELEGRAM_GROUP_DELAY: ${{ vars.TELEGRAM_GROUP_DELAY }}
          TELEGRAM_MAX_RETRIES: ${{ vars.TELEGRAM_MAX_RETRIES }}
          
        run: |
          python bot.py
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-logs
          path: |
            changelog.txt
            atlas_v11.sqlite3
            *.mp3
            *.png

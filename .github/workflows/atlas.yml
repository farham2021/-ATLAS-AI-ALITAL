name: ATLAS v11.2 — Unified Two-Engine + Reliable Delivery

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "MARKET / PERSONAL / BOTH"
        required: false
        default: "BOTH"

      run_mode:
        description: "AUTO / BOTH / ANALYSIS / SNAPSHOT"
        required: false
        default: "AUTO"

  schedule:
    # Hourly scheduler.
    # The engine decides internally when analytical and snapshot
    # operations are required.
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v11-2-${{ github.ref }}
  cancel-in-progress: false

jobs:

  atlas-v11-2:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      # ============================================================
      # CORE
      # ============================================================

      PYTHONUNBUFFERED: "1"

      ATLAS_VERSION: "11.2"

      ATLAS_ENGINE: ${{ github.event.inputs.engine || 'BOTH' }}

      ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'AUTO' }}

      ATLAS_TIMEFRAME: "4H"

      ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"

      ATLAS_TRADINGVIEW_INTERVAL: "240"

      # ============================================================
      # TRADE GEOMETRY
      # ============================================================

      ATLAS_TRADE_GEOMETRY_EPSILON: "1e-12"

      ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: "0.05"

      # ============================================================
      # RISK ENGINE
      # ============================================================

      RISK_PER_TRADE_PCT: "1.5"

      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"

      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_MIN_EXECUTABLE_RR: "2.0"

      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      # ============================================================
      # BACKTEST
      # ============================================================

      ATLAS_BACKTEST_DAYS: "180"

      ATLAS_SIGNAL_HORIZON_BARS: "36"

      ATLAS_BACKTEST_IMPROVEMENT: "10"

      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_CANDLE_EVENT_DEDUP: "1"

      # ============================================================
      # DATABASE / CHANGELOG
      # ============================================================

      ATLAS_SQLITE_FILE: "atlas_v11_2.sqlite3"

      ATLAS_CHANGELOG: "changelog_v11_2.txt"

      # ============================================================
      # TELEGRAM DELIVERY
      # ============================================================

      TELEGRAM_PRIVATE_DELAY: "1.5"

      TELEGRAM_GROUP_DELAY: "3.0"

      TELEGRAM_MAX_RETRIES: "5"

      TELEGRAM_BASE_RETRY_DELAY: "3"

      TELEGRAM_MAX_WAIT: "60"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ============================================================
      # EXTERNAL DATA SOURCES
      # ============================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f "requirements-v11.2.txt" ]; then
            echo "Installing requirements-v11.2.txt"
            python -m pip install -r requirements-v11.2.txt

          elif [ -f "requirements.txt" ]; then
            echo "Installing requirements.txt"
            python -m pip install -r requirements.txt

          else
            echo "No requirements file found."

            echo "Installing minimum runtime dependencies..."

            python -m pip install \
              "ccxt>=4.5.0" \
              requests \
              pandas \
              numpy

          fi

          echo "Dependencies installed successfully."


      # ============================================================
      # 4. PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PROJECT STRUCTURE"
          echo "=================================================="

          required_files=(
            "bot.py"
            "smoke_atlas.py"
            "test_v11_2.py"
          )

          optional_files=(
            "requirements.txt"
            "requirements-v11.2.txt"
            "telegram_delivery_v12.py"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "PASS: $file"

          done

          for file in "${optional_files[@]}"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "INFO: Optional file not present: $file"
            fi

          done


      # ============================================================
      # 5. PYTHON SYNTAX
      # ============================================================

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=================================================="

          python -m py_compile bot.py

          python -m py_compile smoke_atlas.py

          python -m py_compile test_v11_2.py

          if [ -f "telegram_delivery_v12.py" ]; then
            python -m py_compile telegram_delivery_v12.py
          fi

          echo "Python syntax validation PASSED."


      # ============================================================
      # 6. REAL LEGACY IMPORT CHECK
      #
      # IMPORTANT:
      # Do NOT use grep here.
      #
      # grep detects comments such as:
      #     # import bot as engine
      #
      # This check uses Python AST and therefore detects only
      # actual Python import statements.
      # ============================================================

      - name: Validate Python imports
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "LEGACY IMPORT CHECK"
          echo "=================================================="

          python - <<'PY'

          import ast
          import pathlib
          import sys

          files = [
              pathlib.Path("bot.py"),
              pathlib.Path("smoke_atlas.py"),
              pathlib.Path("test_v11_2.py"),
          ]

          forbidden_modules = {
              "ATLAS_v12_bot",
          }

          errors = []

          for path in files:

              print(f"Checking {path} ...")

              source = path.read_text(
                  encoding="utf-8"
              )

              try:
                  tree = ast.parse(
                      source,
                      filename=str(path)
                  )

              except SyntaxError as exc:
                  print(
                      f"ERROR: Syntax error in {path}: "
                      f"{exc}"
                  )
                  sys.exit(1)

              for node in ast.walk(tree):

                  if isinstance(node, ast.Import):

                      for alias in node.names:

                          if alias.name == "bot":
                              errors.append(
                                  f"{path}:{node.lineno}: "
                                  f"actual 'import bot' detected"
                              )

                          if alias.name in forbidden_modules:
                              errors.append(
                                  f"{path}:{node.lineno}: "
                                  f"forbidden module "
                                  f"{alias.name}"
                              )

                  elif isinstance(node, ast.ImportFrom):

                      if node.module == "bot":
                          errors.append(
                              f"{path}:{node.lineno}: "
                              f"actual 'from bot import ...' detected"
                          )

                      if node.module in forbidden_modules:
                          errors.append(
                              f"{path}:{node.lineno}: "
                              f"forbidden module "
                              f"{node.module}"
                          )

              if not any(
                  str(path) in error
                  for error in errors
              ):
                  print(f"PASS: {path}")

          if errors:

              print("")
              print("ERROR: Legacy Python imports detected:")

              for error in errors:
                  print(error)

              sys.exit(1)

          print("")
          print("PASS: no obsolete Python import references detected.")

          PY


      # ============================================================
      # 7. V11.2 SMOKE TEST
      # ============================================================

      - name: Run v11.2 smoke test
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS v11.2 SMOKE TEST"
          echo "=================================================="

          python smoke_atlas.py

          echo "Smoke test PASSED."


      # ============================================================
      # 8. V11.2 UNIT TEST
      # ============================================================

      - name: Run v11.2 test suite
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS v11.2 TEST SUITE"
          echo "=================================================="

          python test_v11_2.py

          echo "v11.2 test suite PASSED."


      # ============================================================
      # 9. TELEGRAM CONFIGURATION
      # ============================================================

      - name: Validate Telegram configuration
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM CONFIGURATION"
          echo "=================================================="

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && \
             [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then

            echo "ERROR: No Telegram destination configured."

            echo "Set at least one of:"
            echo "TELEGRAM_CHAT_ID"
            echo "TELEGRAM_GROUP_CHAT_ID"

            exit 1
          fi

          if [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "PASS: Private Telegram destination configured."
          else
            echo "INFO: Private Telegram destination not configured."
          fi

          if [ -n "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "PASS: Telegram group destination configured."
          else
            echo "INFO: Telegram group destination not configured."
          fi


      # ============================================================
      # 10. TELEGRAM PREFLIGHT
      # ============================================================

      - name: Telegram bot preflight
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM PREFLIGHT"
          echo "=================================================="

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get(
              "TELEGRAM_TOKEN",
              ""
          ).strip()

          if not token:
              raise SystemExit(
                  "TELEGRAM_TOKEN is empty."
              )

          url = (
              "https://api.telegram.org/"
              f"bot{token}/getMe"
          )

          try:

              with urllib.request.urlopen(
                  url,
                  timeout=30
              ) as response:

                  raw = response.read().decode(
                      "utf-8"
                  )

              payload = json.loads(raw)

          except Exception as exc:

              raise SystemExit(
                  "Telegram getMe request failed: "
                  + str(exc)
              )

          if not payload.get("ok"):

              raise SystemExit(
                  "Telegram getMe returned failure: "
                  + str(payload)
              )

          bot = payload.get(
              "result",
              {}
          )

          print(
              "Telegram bot connection OK."
          )

          print(
              "Bot username:",
              bot.get(
                  "username",
                  "unknown"
              )
          )

          print(
              "Bot ID:",
              bot.get(
                  "id",
                  "unknown"
              )
          )

          PY


      # ============================================================
      # 11. TELEGRAM DESTINATION TEST
      #
      # This verifies that the configured chat IDs are actually
      # reachable by the bot before the analytical engine runs.
      # ============================================================

      - name: Validate Telegram destinations
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM DESTINATION CHECK"
          echo "=================================================="

          python - <<'PY'

          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_TOKEN"].strip()

          destinations = []

          private_chat = os.environ.get(
              "TELEGRAM_CHAT_ID",
              ""
          ).strip()

          group_chat = os.environ.get(
              "TELEGRAM_GROUP_CHAT_ID",
              ""
          ).strip()

          if private_chat:
              destinations.append(
                  ("PRIVATE", private_chat)
              )

          if group_chat:
              destinations.append(
                  ("GROUP", group_chat)
              )

          if not destinations:
              raise SystemExit(
                  "No Telegram destination configured."
              )

          for label, chat_id in destinations:

              print(
                  f"Checking {label} destination..."
              )

              query = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id
                  }
              )

              url = (
                  "https://api.telegram.org/"
                  f"bot{token}/getChat?{query}"
              )

              try:

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as response:

                      payload = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

              except Exception as exc:

                  raise SystemExit(
                      f"{label} Telegram destination "
                      f"check failed: {exc}"
                  )

              if not payload.get("ok"):

                  raise SystemExit(
                      f"{label} Telegram destination "
                      f"is not reachable: "
                      f"{payload}"
                  )

              chat = payload.get(
                  "result",
                  {}
              )

              print(
                  f"PASS: {label} destination reachable"
              )

              print(
                  "Chat type:",
                  chat.get(
                      "type",
                      "unknown"
                  )
              )

              print(
                  "Chat ID:",
                  chat.get(
                      "id",
                      "unknown"
                  )
              )

          PY


      # ============================================================
      # 12. RUN ATLAS v11.2
      # ============================================================

      - name: Run ATLAS AI v11.2
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "RUNNING ATLAS AI v11.2"
          echo "=================================================="

          python bot.py


      # ============================================================
      # 13. VERIFY TELEGRAM DELIVERY
      #
      # bot.py must return non-zero if delivery completely fails.
      # The workflow therefore cannot report SUCCESS when Telegram
      # delivery failed silently.
      # ============================================================

      - name: Verify ATLAS execution
        if: success()
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS v11.2 EXECUTION STATUS"
          echo "=================================================="

          echo "ATLAS v11.2 engine completed successfully."

          echo "Telegram delivery function completed."

          echo "Analytical timeframe: ${ATLAS_TIMEFRAME}"

          echo "Engine: ${ATLAS_ENGINE}"

          echo "Run mode: ${ATLAS_RUN_MODE}"


      # ============================================================
      # 14. SQLITE FINALIZATION
      # ============================================================

      - name: Finalize SQLite
        if: always()
        run: |
          set -euo pipefail

          if [ -f "${ATLAS_SQLITE_FILE}" ]; then

            echo "=================================================="
            echo "SQLITE FINALIZATION"
            echo "=================================================="

            python - <<'PY'

          import os
          import sqlite3

          db = os.environ["ATLAS_SQLITE_FILE"]

          con = sqlite3.connect(
              db,
              timeout=30
          )

          try:

              con.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              )

              con.execute(
                  "PRAGMA optimize"
              )

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              status = (
                  result[0]
                  if result
                  else "UNKNOWN"
              )

              print(
                  "SQLite integrity:",
                  status
              )

              if status != "ok":
                  raise SystemExit(
                      "SQLite integrity check FAILED."
                  )

          finally:

              con.close()

          PY

          else

            echo "SQLite file not created in this run."
            echo "Skipping SQLite finalization."

          fi


      # ============================================================
      # 15. FINAL STATUS
      # ============================================================

      - name: Final status
        if: success()
        run: |
          echo ""
          echo "=================================================="
          echo "ATLAS AI v11.2 COMPLETED SUCCESSFULLY"
          echo "=================================================="
          echo ""
          echo "Version       : ${ATLAS_VERSION}"
          echo "Timeframe     : ${ATLAS_TIMEFRAME}"
          echo "Engine        : ${ATLAS_ENGINE}"
          echo "Run mode      : ${ATLAS_RUN_MODE}"
          echo ""
          echo "Market engine : OK"
          echo "Personal      : OK"
          echo "Snapshot      : OK"
          echo "Telegram      : OK"
          echo ""
          echo "ATLAS v11.2 workflow completed."
          echo "=================================================="

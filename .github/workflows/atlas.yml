name: ATLAS AI v11.2 — Unified Two-Engine

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "MARKET / PERSONAL / BOTH"
        required: false
        default: "BOTH"

      run_mode:
        description: "AUTO / BOTH / ANALYSIS / SNAPSHOT"
        required: false
        default: "BOTH"

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v11-2
  cancel-in-progress: false

jobs:

  atlas-v11-2:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      PYTHONUNBUFFERED: "1"

      # ==========================================================
      # ATLAS v11.2
      # ==========================================================

      ATLAS_VERSION: "11.2"
      ATLAS_ENGINE: ${{ github.event.inputs.engine || 'BOTH' }}
      ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'AUTO' }}

      ATLAS_TIMEFRAME: "4H"

      ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"
      ATLAS_TRADINGVIEW_INTERVAL: "240"

      # ==========================================================
      # TRADE GEOMETRY
      # ==========================================================

      ATLAS_TRADE_GEOMETRY_EPSILON: "1e-12"

      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      ATLAS_MIN_EXECUTABLE_RR: "2.0"
      ATLAS_MIN_WATCH_RR: "1.0"

      ATLAS_MIN_VOLUME_RATIO: "1.20"

      RISK_PER_TRADE_PCT: "1.5"
      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
      ATLAS_MAX_LEVERAGE: "10"

      # ==========================================================
      # BACKTEST / MEMORY
      # ==========================================================

      ATLAS_BACKTEST_DAYS: "180"
      ATLAS_SIGNAL_HORIZON_BARS: "36"
      ATLAS_BACKTEST_IMPROVEMENT: "10"
      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_CANDLE_EVENT_DEDUP: "1"

      ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
      ATLAS_SIGNAL_MEMORY_HOURS: "12"
      ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"

      ATLAS_REQUEST_SLEEP_SECONDS: "0.50"

      # ==========================================================
      # SNAPSHOT
      # ==========================================================

      ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: "0.05"

      # ==========================================================
      # SQLITE
      # ==========================================================

      ATLAS_SQLITE_FILE: "atlas_v11_2.sqlite3"
      ATLAS_CHANGELOG: "changelog_v11_2.txt"

      # ==========================================================
      # TELEGRAM
      # ==========================================================

      TELEGRAM_PRIVATE_DELAY: "1.5"
      TELEGRAM_GROUP_DELAY: "3.0"

      TELEGRAM_MAX_RETRIES: "5"
      TELEGRAM_BASE_RETRY_DELAY: "3"
      TELEGRAM_MAX_WAIT: "60"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ==========================================================
      # SUPABASE
      # ==========================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ==========================================================
      # MARKET DATA
      # ==========================================================

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |

          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          if [ -f requirements-v11.2.txt ]; then

            python -m pip install \
              -r requirements-v11.2.txt

          elif [ -f requirements.txt ]; then

            python -m pip install \
              -r requirements.txt

          else

            python -m pip install \
              "ccxt>=4.5.0"

          fi

          python -c \
            "import ccxt; print('CCXT:', ccxt.__version__)"

      # ==========================================================
      # 4. REQUIRED FILES
      # ==========================================================

      - name: Validate project structure
        run: |

          set -euo pipefail

          required_files=(

            "bot.py"
            "smoke_atlas.py"
            "test_v11_2.py"

          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then

              echo "ERROR: Missing required file: $file"

              exit 1

            fi

            echo "PASS: $file"

          done

      # ==========================================================
      # 5. PYTHON SYNTAX
      # ==========================================================

      - name: Validate Python syntax
        run: |

          set -euo pipefail

          python -m py_compile bot.py

          python -m py_compile smoke_atlas.py

          python -m py_compile test_v11_2.py

          echo "Python syntax validation PASSED."

      # ==========================================================
      # 6. V11.2 SMOKE TEST
      # ==========================================================

      - name: Run ATLAS v11.2 smoke test
        run: |

          set -euo pipefail

          python smoke_atlas.py

      # ==========================================================
      # 7. V11.2 UNIT TEST
      # ==========================================================

      - name: Run ATLAS v11.2 unit test
        run: |

          set -euo pipefail

          python test_v11_2.py

      # ==========================================================
      # 8. TELEGRAM CONFIGURATION
      # ==========================================================

      - name: Validate Telegram configuration
        run: |

          set -euo pipefail

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then

            echo "ERROR: TELEGRAM_TOKEN is missing."

            exit 1

          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && \
             [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then

            echo "ERROR: No Telegram destination configured."

            exit 1

          fi

          echo "Telegram configuration detected."

      # ==========================================================
      # 9. TELEGRAM PREFLIGHT
      # ==========================================================

      - name: Telegram preflight
        run: |

          set -euo pipefail

          python - <<'PY'

          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_TOKEN"]

          url = (
              "https://api.telegram.org/"
              f"bot{token}/getMe"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "ATLAS-AI/11.2"
              },
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:

              payload = json.loads(
                  response.read().decode(
                      "utf-8"
                  )
              )

          if not payload.get("ok"):

              raise SystemExit(
                  "Telegram getMe failed: "
                  + str(payload)
              )

          bot = payload.get(
              "result",
              {}
          )

          print(
              "Telegram bot OK:",
              bot.get(
                  "username",
                  "unknown"
              ),
          )

          PY

      # ==========================================================
      # 10. RUN ATLAS v11.2
      # ==========================================================

      - name: Run ATLAS AI v11.2
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "ATLAS AI v11.2 START"
          echo "=========================================="

          echo "Version:"
          echo "$ATLAS_VERSION"

          echo "Engine:"
          echo "$ATLAS_ENGINE"

          echo "Run mode:"
          echo "$ATLAS_RUN_MODE"

          echo "Timeframe:"
          echo "$ATLAS_TIMEFRAME"

          python bot.py

      # ==========================================================
      # 11. SQLITE FINALIZATION
      # ==========================================================

      - name: Finalize SQLite
        if: always()
        run: |

          set -euo pipefail

          DB="$ATLAS_SQLITE_FILE"

          if [ -f "$DB" ]; then

            python - <<'PY'

          import os
          import sqlite3

          db = os.environ[
              "ATLAS_SQLITE_FILE"
          ]

          con = sqlite3.connect(
              db,
              timeout=30
          )

          try:

              con.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              )

              con.execute(
                  "PRAGMA optimize"
              )

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              print(
                  "SQLite integrity:",
                  result[0]
                  if result
                  else "UNKNOWN"
              )

              if (
                  not result
                  or result[0] != "ok"
              ):

                  raise SystemExit(1)

          finally:

              con.close()

          PY

          fi

      # ==========================================================
      # 12. FINAL STATUS
      # ==========================================================

      - name: Final status
        if: success()
        run: |

          echo "=========================================="
          echo "ATLAS AI v11.2 COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Telegram delivery completed."

          echo "4H analytical engine completed."

          echo "3H snapshot scheduler active."

          echo "No legacy wrapper/import validation errors."

name: ATLAS v12 Multi-Asset Self-Healing

on:
  schedule:
    # Hourly storage-only wake; report slots take priority when due.
    - cron: "17,47 * * * *"
    # Explicit primary + recovery wake-ups for the three Europe/Paris report slots.
    # We intentionally avoid a high-frequency */10 watchdog: GitHub scheduled runs
    # are best-effort and may be delayed/dropped under load. These sparse UTC wakes
    # cover BOTH CEST (UTC+2) and CET (UTC+1); atlas_schedule_guard.py is authoritative.
    # Paris targets: 10:05, 14:50, 18:05 local. Minutes are offset by +2/+32 to
    # reduce top-of-hour contention while staying inside the recovery window.
    # DEEP4H + NIGHTLY23: primary/recovery for both DST offsets.
    - cron: "7,37 8,9,16,17 * * *"
    # DAILY16: primary for both DST offsets.
    - cron: "52 12,13 * * *"
    # DAILY16: recovery for both DST offsets.
    - cron: "22 13,14 * * *"
  workflow_dispatch:
    inputs:
      cycle_mode:
        description: "Manual ATLAS cycle"
        required: true
        default: "HOURLY"
        type: choice
        options: [HOURLY, DEEP4H, DAILY16, NIGHTLY23]

permissions:
  contents: read
concurrency:
  group: atlas-bot
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Decide ATLAS report cycle
        id: plan
        env:
          ATLAS_SCHEDULER_TABLE: atlas_scheduler_runs
          ATLAS_REPORT_RECOVERY_MIN: "180"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python atlas_schedule_guard.py plan --manual "${{ inputs.cycle_mode }}" --github-output "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.schedule }}" = "17,47 * * * *" ]; then
              python atlas_schedule_guard.py plan --hourly-wake --github-output "$GITHUB_OUTPUT"
            else
              python atlas_schedule_guard.py plan --github-output "$GITHUB_OUTPUT"
            fi
          fi

      - name: Claim slot lease
        id: claim
        if: steps.plan.outputs.scheduled == '1' && steps.plan.outputs.mode != 'NONE'
        # Fail-open only for infrastructure/RPC failure. A successful DENIED claim still skips execution.
        env:
          ATLAS_SCHEDULER_TABLE: atlas_scheduler_runs
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python atlas_schedule_guard.py claim --run-key "${{ steps.plan.outputs.run_key }}" --cycle "${{ steps.plan.outputs.mode }}" --ttl-min 65 --github-output "$GITHUB_OUTPUT"

      # Single gate for all downstream steps (install / verify / run).
      # Manual (scheduled!=1) always runs when mode!=NONE.
      # Scheduled runs only when CLAIMED, or when claim infrastructure failed (fail-open).
      - name: Resolve should_run
        id: gate
        run: |
          set -euo pipefail
          MODE="${{ steps.plan.outputs.mode }}"
          SCHED="${{ steps.plan.outputs.scheduled }}"
          CLAIMED="${{ steps.claim.outputs.claimed }}"
          CLAIM_OUTCOME="${{ steps.claim.outcome }}"
          SHOULD=0
          PATH_KIND=skip
          if [ "$MODE" != "NONE" ]; then
            if [ "$SCHED" != "1" ]; then
              SHOULD=1
              PATH_KIND=manual
            elif [ "$CLAIMED" = "CLAIMED" ]; then
              SHOULD=1
              PATH_KIND=claimed
            fi
          fi
          echo "should_run=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "path_kind=$PATH_KIND" >> "$GITHUB_OUTPUT"
          echo "ATLAS gate: mode=$MODE scheduled=$SCHED claimed=${CLAIMED:-n/a} outcome=${CLAIM_OUTCOME:-n/a} -> should_run=$SHOULD ($PATH_KIND)"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify release
        if: steps.gate.outputs.should_run == '1'
        run: |
          python -m unittest -v test_atlas_futures_png.py test_atlas_scheduler_safety.py
          python -m py_compile atlas_futures_png.py bot.py analysis.py atlas_professional_monitor.py atlas_self_learning.py atlas_schedule_guard.py iran_data_collector_v2.py iran_data_health.py
          python -c "import analysis; assert analysis._professional_analyze is not None, 'professional monitor import failed'"
          test -f atlas_schedule_guard.py

      - name: Run ATLAS
        if: steps.gate.outputs.should_run == '1'
        env:
          PYTHONUNBUFFERED: "1"
          ATLAS_VERSION: "ATLAS v12 MULTI-ASSET"
          ATLAS_ENGINE: BOTH
          ATLAS_SCHEDULED_CADENCE: workflow
          ATLAS_RUN_MODE: ANALYSIS
          SELECTED_MODE: ${{ steps.plan.outputs.mode }}

          ATLAS_PNG_ONLY: "1"
          ATLAS_FUTURES_CAPITAL_USD: "2000"
          ATLAS_FUTURES_RISK_PCT: "1"
          ATLAS_FUTURES_MAX_LEVERAGE: "3"
          ATLAS_IRAN_MULTI_ASSET_ENABLED: "1"
          ATLAS_IRAN_REPORT_DAILY16: "1"
          ATLAS_IRAN_REPORT_NIGHTLY23: "0"
          ATLAS_IRAN_DASHBOARD_ENABLED: "1"
          ATLAS_IRAN_DASHBOARD_NIGHTLY: "0"

          ATLAS_DESK_ENABLED: "1"
          ATLAS_DESK_INGEST_ENABLED: "0"
          ATLAS_DESK_RISK_PCT: "1.5"
          ATLAS_DESK_HOURLY_PUSH: "0"
          ATLAS_DESK_ALLOW_DM_ONLY: "0"
          ATLAS_DESK_SEND_ON_DEEP: "0"
          ATLAS_DESK_USERS_TABLE: atlas_desk_users
          ATLAS_DESK_META_TABLE: atlas_desk_meta
          ATLAS_DESK_DELIVERY_TABLE: atlas_desk_deliveries
          ATLAS_DESK_HOLDINGS_TABLE: atlas_desk_holdings

          ATLAS_NIGHTLY_BRIEF_ENABLED: "1"
          ATLAS_DAILY_DELTA_ENABLED: "1"
          ATLAS_EXPIRED_SIGNALS_ENABLED: "1"
          ATLAS_SIGNAL_STABILITY_ENABLED: "1"
          ATLAS_RARE_ALERT_ENABLED: "1"
          ATLAS_RARE_ALERT_SYMBOLS: BTC,ETH,SOL,ADA,XRP,ZEC
          ATLAS_RARE_ALERT_THRESHOLD_PCT: "7.5"
          ATLAS_RARE_ALERT_COOLDOWN_HOURS: "4"
          ATLAS_RARE_ALERT_MAX_PER_DAY: "6"
          ATLAS_RARE_ALERT_LOOKBACK_MINUTES: "90"

          ATLAS_EXECUTION_MODE: PAPER
          ATLAS_LIVE_TRADING: "0"
          ATLAS_EXEC_REQUIRE_PERSISTENCE: "1"
          ATLAS_EXEC_REQUIRE_PROTECTIVE: "1"
          ATLAS_EXEC_ALLOW_SPOT_SELL: "0"
          ATLAS_EXEC_SYMBOLS: BTC,ETH
          ATLAS_EXEC_EQUITY_USDT: "10000"
          ATLAS_EXEC_MAX_LEVERAGE: "3"
          ATLAS_EXEC_MAX_OPEN: "2"
          ATLAS_DAILY_KILL_R: "3"

          RISK_PER_TRADE_PCT: "1.5"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
          ATLAS_MAX_LEVERAGE: "10"
          ATLAS_MIN_CONFIDENCE: "55"
          ATLAS_MIN_WATCH_CONFIDENCE: "55"
          ATLAS_MIN_EXECUTABLE_RR: "2.0"
          ATLAS_MIN_VOLUME_RATIO: "0.60"
          ATLAS_H4_FALLBACK_MIN_SCORE: "70"

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          set -euo pipefail
          # Manual dispatch is always diagnostic: no Telegram delivery or paper execution.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export ATLAS_DELIVERY_MODE=STORAGE_ONLY
            export ATLAS_REPORT_WINDOW=0
            export ATLAS_EXECUTION_ENABLED=0
          fi
          case "$SELECTED_MODE" in
            HOURLY)
              export ATLAS_DELIVERY_MODE=STORAGE_ONLY
              export ATLAS_PHASE37_CYCLE=HOURLY
              export ATLAS_PHASE37_DEEP_4H=0
              export ATLAS_PHASE37_DAILY_REPORT=0
              export ATLAS_PHASE39_NIGHTLY_REPORT=0
              export ATLAS_BOOK_SCAN_AUTO=0
              export ATLAS_EXECUTION_ENABLED=0
              export ATLAS_REPORT_WINDOW=0 ;;
            DEEP4H)
              # Scheduled DEEP4H is the first approved report window.
              # Manual DEEP4H is diagnostic/storage-only so tests never spam Telegram.
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                export ATLAS_DELIVERY_MODE=STORAGE_ONLY
                export ATLAS_REPORT_WINDOW=0
              else
                export ATLAS_DELIVERY_MODE=STORAGE_ONLY
                export ATLAS_REPORT_WINDOW=0
              fi
              export ATLAS_PHASE37_CYCLE=DEEP4H
              export ATLAS_PHASE37_DEEP_4H=1
              export ATLAS_PHASE37_DAILY_REPORT=0
              export ATLAS_PHASE39_NIGHTLY_REPORT=0
              export ATLAS_BOOK_SCAN_AUTO=1
              export ATLAS_EXECUTION_ENABLED=1 ;;
            DAILY16)
              export ATLAS_DELIVERY_MODE=FULL
              export ATLAS_PHASE37_CYCLE=DAILY16
              export ATLAS_PHASE37_DEEP_4H=1
              export ATLAS_PHASE37_DAILY_REPORT=1
              export ATLAS_PHASE39_NIGHTLY_REPORT=0
              export ATLAS_BOOK_SCAN_AUTO=1
              export ATLAS_EXECUTION_ENABLED=1
              export ATLAS_REPORT_WINDOW=1 ;;
            NIGHTLY23)
              export ATLAS_DELIVERY_MODE=STORAGE_ONLY
              export ATLAS_PHASE37_CYCLE=NIGHTLY23
              export ATLAS_PHASE37_DEEP_4H=0
              export ATLAS_PHASE37_DAILY_REPORT=0
              export ATLAS_PHASE39_NIGHTLY_REPORT=0
              export ATLAS_BOOK_SCAN_AUTO=0
              export ATLAS_EXECUTION_ENABLED=0
              export ATLAS_REPORT_WINDOW=0 ;;
            *) exit 2 ;;
          esac
          # Enforce diagnostic settings AFTER mode-specific defaults, so DAILY16 and
          # NIGHTLY23 cannot silently reset manual dispatch to FULL.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export ATLAS_DELIVERY_MODE=STORAGE_ONLY
            export ATLAS_REPORT_WINDOW=0
            export ATLAS_EXECUTION_ENABLED=0
            # Bot's DAILY16/NIGHTLY23 delivery blocks are keyed on cycle flags,
            # not ATLAS_DELIVERY_MODE. Disable those blocks for manual diagnostics.
            export ATLAS_PHASE37_DAILY_REPORT=0
            export ATLAS_PHASE39_NIGHTLY_REPORT=0
            unset TELEGRAM_TOKEN TELEGRAM_CHAT_ID TELEGRAM_GROUP_CHAT_ID
          fi
          python bot.py

      - name: Validate research risk sidecar
        if: steps.gate.outputs.should_run == '1'
        run: |
          node --check research/atlas-production-shadow.cjs
          node --test tests/atlas-quant-core.test.cjs tests/atlas-intelligence.test.cjs tests/atlas-risk-validation.test.cjs tests/atlas-production-shadow.test.cjs

      - name: Persist CoinGecko top-100 market snapshots (research only)
        if: steps.gate.outputs.should_run == '1'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,datetime,time
          from urllib.parse import urlencode
          base=os.environ.get('SUPABASE_URL','').rstrip('/')
          key=os.environ.get('SUPABASE_SERVICE_ROLE_KEY','')
          if not base or not key:
              raise RuntimeError('Supabase credentials unavailable')
          params=urlencode({'vs_currency':'usd','order':'market_cap_desc','per_page':100,'page':1,'sparkline':'false'})
          cgkey=os.environ.get('COINGECKO_API_KEY','')
          headers={'Accept':'application/json','User-Agent':'ATLAS-Research/1.0'}
          host='https://api.coingecko.com/api/v3'
          if cgkey:
              headers['x-cg-demo-api-key']=cgkey
          req=urllib.request.Request(host+'/coins/markets?'+params,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as response:
              coins=json.load(response)
          if not isinstance(coins,list) or len(coins)<50:
              raise RuntimeError('Incomplete CoinGecko top-100 response')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          rows=[]
          for c in coins:
              sym=str(c.get('symbol','')).upper()
              price=c.get('current_price')
              if not sym or not isinstance(price,(int,float)) or price<=0:
                  continue
              rows.append({'captured_at':now,'symbol':sym,'asset':str(c.get('id','')),'price':price,'value':price,
                'payload':{'source':'coingecko','research_only':True,'market_cap_rank':c.get('market_cap_rank'),
                'volume_24h':c.get('total_volume'),'change_24h_pct':c.get('price_change_percentage_24h'),
                'provider_last_updated':c.get('last_updated'),'currency':'USD'}})
          if len(rows)<40:
              raise RuntimeError('Too few valid CoinGecko market snapshots')
          endpoint=base+'/rest/v1/atlas_market_snapshots'
          auth={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=minimal'}
          post=urllib.request.Request(endpoint,data=json.dumps(rows).encode(),headers=auth,method='POST')
          with urllib.request.urlopen(post,timeout=30) as response:
              print('Stored',len(rows),'CoinGecko top-market research snapshots; HTTP',response.status)
          # CoinMarketCap is an independent cross-check only; never silently replace prices.
          cmc=os.environ.get('COINMARKETCAP_API_KEY','')
          if cmc:
              try:
                  q=urllib.request.Request('https://pro-api.coinmarketcap.com/v2/cryptocurrency/quotes/latest?symbol=BTC,ETH&convert=USD',
                    headers={'X-CMC_PRO_API_KEY':cmc,'Accept':'application/json'})
                  with urllib.request.urlopen(q,timeout=20) as response:
                      comparison=json.load(response)
                  print('CoinMarketCap comparison received:',bool(comparison.get('data')))
              except Exception as exc:
                  print('CoinMarketCap validation unavailable:',str(exc)[:180])
          print('TradingView not used as an unofficial historical API; exchange OHLCV remains separate.')
          PY

      - name: ATLAS live-data research shadow (no Telegram or orders)
        if: steps.gate.outputs.should_run == '1'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_RESEARCH_SYMBOLS: XAUUSD,XAGUSD,BTC,ETH
        run: node research/atlas-production-shadow.cjs

      # Normal path: mark DONE with the lease token issued by claim.
      - name: Mark slot complete
        if: success() && steps.gate.outputs.should_run == '1' && steps.gate.outputs.path_kind == 'claimed'
        env:
          ATLAS_SCHEDULER_TABLE: atlas_scheduler_runs
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python atlas_schedule_guard.py mark \
            --run-key "${{ steps.plan.outputs.run_key }}" \
            --cycle "${{ steps.plan.outputs.mode }}" \
            --lease-token "${{ steps.claim.outputs.lease_token }}" \
            --source self-healing

      # Deprecated fail-open path is intentionally disabled.\n      # Fail-open path: claim RPC/infra failed, but the analysis still ran.
      # Force-DONE so the same Paris slot is not re-selected inside the recovery window.
      - name: Force-done after fail-open run
        if: ${{ false }}
        continue-on-error: true
        env:
          ATLAS_SCHEDULER_TABLE: atlas_scheduler_runs
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python atlas_schedule_guard.py force-done \
            --run-key "${{ steps.plan.outputs.run_key }}" \
            --cycle "${{ steps.plan.outputs.mode }}" \
            --source fail-open-after-success

name: ATLAS v11.2 — Unified Two-Engine + Trade Geometry + Dynamic CSV + Dashboard + 3H Snapshot

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "MARKET / PERSONAL / BOTH"
        required: false
        default: "BOTH"

      run_mode:
        description: "AUTO / BOTH / ANALYSIS / SNAPSHOT"
        required: false
        default: "AUTO"

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v11-2
  cancel-in-progress: false

jobs:

  atlas-v11-2:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      # ============================================================
      # CORE
      # ============================================================

      PYTHONUNBUFFERED: "1"

      ATLAS_VERSION: "11.2"

      ATLAS_ENGINE: ${{ github.event.inputs.engine || 'BOTH' }}

      ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'AUTO' }}

      ATLAS_TIMEFRAME: "4H"

      # ============================================================
      # TRADINGVIEW
      # ============================================================

      ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"

      ATLAS_TRADINGVIEW_INTERVAL: "240"

      # ============================================================
      # TRADE GEOMETRY
      # ============================================================

      ATLAS_TRADE_GEOMETRY_EPSILON: "1e-12"

      ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: "0.05"

      # ============================================================
      # RISK ENGINE
      # ============================================================

      RISK_PER_TRADE_PCT: "1.5"

      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"

      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_MIN_EXECUTABLE_RR: "2.0"

      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      # ============================================================
      # BACKTEST
      # ============================================================

      ATLAS_BACKTEST_DAYS: "180"

      ATLAS_SIGNAL_HORIZON_BARS: "36"

      ATLAS_BACKTEST_IMPROVEMENT: "10"

      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_CANDLE_EVENT_DEDUP: "1"

      # ============================================================
      # DATABASE / CHANGELOG
      # ============================================================

      ATLAS_SQLITE_FILE: "atlas_v11_2.sqlite3"

      ATLAS_CHANGELOG: "changelog_v11_2.txt"

      # ============================================================
      # TELEGRAM DELIVERY
      # ============================================================

      TELEGRAM_PRIVATE_DELAY: "1.5"

      TELEGRAM_GROUP_DELAY: "3.0"

      TELEGRAM_MAX_RETRIES: "5"

      TELEGRAM_BASE_RETRY_DELAY: "3"

      TELEGRAM_MAX_WAIT: "60"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ============================================================
      # SUPABASE
      # ============================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ============================================================
      # MARKET DATA
      # ============================================================

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      # ============================================================
      # NEWS
      # ============================================================

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      # ============================================================
      # OPTIONAL TRADINGVIEW CONFIRMATION
      # ============================================================

      TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f "requirements-v11.2.txt" ]; then
            echo "Installing requirements-v11.2.txt"
            python -m pip install -r requirements-v11.2.txt

          elif [ -f "requirements.txt" ]; then
            echo "Installing requirements.txt"
            python -m pip install -r requirements.txt

          else
            echo "No requirements file found."
            echo "Installing minimum runtime dependencies."

            python -m pip install --upgrade \
              ccxt \
              requests \
              pandas \
              numpy
          fi

          echo "Dependency installation completed."

      # ============================================================
      # 4. PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PROJECT STRUCTURE"
          echo "=================================================="

          required_files=(
            "bot.py"
            "smoke_atlas.py"
            "test_v11_2.py"
          )

          optional_files=(
            "requirements.txt"
            "requirements-v11.2.txt"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi

            echo "PASS: $file"

          done

          for file in "${optional_files[@]}"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "INFO: $file not present"
            fi

          done

          echo "=================================================="
          echo "PROJECT STRUCTURE PASSED"
          echo "=================================================="

      # ============================================================
      # 5. REAL PYTHON LEGACY IMPORT CHECK
      #
      # IMPORTANT:
      # Do NOT use grep here.
      #
      # grep was previously detecting comments such as:
      #
      # "import bot as engine"
      #
      # inside smoke_atlas.py and incorrectly failing the workflow.
      #
      # This check uses Python AST and therefore detects only actual
      # Python import statements.
      # ============================================================

      - name: Validate Python imports
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "LEGACY REFERENCE CHECK"
          echo "=================================================="

          python - <<'PY'
          import ast
          import pathlib
          import sys

          files = [
              "bot.py",
              "smoke_atlas.py",
              "test_v11_2.py",
          ]

          forbidden_module = "bot"
          forbidden_symbol = "ATLAS_v12_bot"

          failed = False

          for filename in files:

              path = pathlib.Path(filename)

              if not path.exists():
                  print(f"ERROR: Missing file: {filename}")
                  failed = True
                  continue

              print(f"Checking {filename} ...")

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              try:
                  tree = ast.parse(
                      source,
                      filename=filename
                  )
              except SyntaxError as exc:
                  print(
                      f"ERROR: Cannot parse {filename}: "
                      f"{exc}"
                  )
                  failed = True
                  continue

              for node in ast.walk(tree):

                  # ------------------------------------------
                  # import bot
                  # import bot as engine
                  # ------------------------------------------

                  if isinstance(node, ast.Import):

                      for alias in node.names:

                          if alias.name == forbidden_module:

                              print(
                                  f"ERROR: Real import of "
                                  f"'bot' found in {filename} "
                                  f"at line {node.lineno}"
                              )

                              failed = True

                  # ------------------------------------------
                  # from bot import ...
                  # ------------------------------------------

                  elif isinstance(node, ast.ImportFrom):

                      if node.module == forbidden_module:

                          print(
                              f"ERROR: Real 'from bot import' "
                              f"found in {filename} "
                              f"at line {node.lineno}"
                          )

                          failed = True

              # ----------------------------------------------
              # ATLAS_v12_bot must not exist as executable code
              # ----------------------------------------------

              for node in ast.walk(tree):

                  if isinstance(
                      node,
                      ast.Name
                  ):

                      if node.id == forbidden_symbol:

                          print(
                              f"ERROR: Forbidden symbol "
                              f"'{forbidden_symbol}' found "
                              f"in executable code in "
                              f"{filename} "
                              f"at line {node.lineno}"
                          )

                          failed = True

                  elif isinstance(
                      node,
                      ast.Attribute
                  ):

                      if node.attr == forbidden_symbol:

                          print(
                              f"ERROR: Forbidden attribute "
                              f"'{forbidden_symbol}' found "
                              f"in executable code in "
                              f"{filename} "
                              f"at line {node.lineno}"
                          )

                          failed = True

              if not failed:
                  print(f"PASS: {filename}")

          if failed:
              print("")
              print(
                  "ERROR: Real obsolete V11/V12 "
                  "wrapper reference detected."
              )
              sys.exit(1)

          print("")
          print(
              "PASS: No obsolete executable "
              "engine references detected."
          )
          PY

      # ============================================================
      # 6. PYTHON SYNTAX
      # ============================================================

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=================================================="

          python -m py_compile bot.py

          python -m py_compile smoke_atlas.py

          python -m py_compile test_v11_2.py

          echo "Python syntax validation PASSED."

      # ============================================================
      # 7. SMOKE TEST
      # ============================================================

      - name: Run v11.2 smoke test
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS v11.2 SMOKE TEST"
          echo "=================================================="

          python smoke_atlas.py

          echo "Smoke test completed."

      # ============================================================
      # 8. V11.2 TEST SUITE
      # ============================================================

      - name: Run v11.2 test suite
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ATLAS v11.2 TEST SUITE"
          echo "=================================================="

          python test_v11_2.py

          echo "ATLAS v11.2 tests PASSED."

      # ============================================================
      # 9. TELEGRAM CONFIGURATION
      # ============================================================

      - name: Validate Telegram configuration
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM CONFIGURATION"
          echo "=================================================="

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && \
             [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then

            echo "ERROR: No Telegram destination configured."
            echo "Set TELEGRAM_CHAT_ID and/or TELEGRAM_GROUP_CHAT_ID."
            exit 1
          fi

          if [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "PASS: Private Telegram destination configured."
          else
            echo "INFO: Private Telegram destination not configured."
          fi

          if [ -n "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "PASS: Telegram group destination configured."
          else
            echo "INFO: Telegram group destination not configured."
          fi

          echo "Telegram configuration validation PASSED."

      # ============================================================
      # 10. TELEGRAM PREFLIGHT
      # ============================================================

      - name: Telegram preflight
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM PREFLIGHT"
          echo "=================================================="

          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get(
              "TELEGRAM_TOKEN",
              ""
          ).strip()

          if not token:
              raise SystemExit(
                  "TELEGRAM_TOKEN is empty."
              )

          url = (
              "https://api.telegram.org/"
              f"bot{token}/getMe"
          )

          try:

              with urllib.request.urlopen(
                  url,
                  timeout=30
              ) as response:

                  payload = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as exc:

              raise SystemExit(
                  "Telegram getMe request failed: "
                  + str(exc)
              )

          if not payload.get("ok"):

              raise SystemExit(
                  "Telegram getMe returned failure: "
                  + str(payload)
              )

          bot = payload.get(
              "result",
              {}
          )

          print(
              "Telegram bot OK:",
              bot.get(
                  "username",
                  "unknown"
              )
          )

          print(
              "Bot ID:",
              bot.get(
                  "id",
                  "unknown"
              )
          )
          PY

      # ============================================================
      # 11. RUN ATLAS v11.2
      # ============================================================

      - name: Run ATLAS AI v11.2
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "RUNNING ATLAS AI v11.2"
          echo "=================================================="

          python bot.py

          echo "ATLAS v11.2 execution completed."

      # ============================================================
      # 12. TELEGRAM DELIVERY RESULT
      # ============================================================

      - name: Verify Telegram delivery
        if: success()
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TELEGRAM DELIVERY"
          echo "=================================================="

          echo "ATLAS v11.2 completed without runtime error."

          if [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Private destination configured."
          fi

          if [ -n "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "Group destination configured."
          fi

          echo "Telegram delivery stage completed."

      # ============================================================
      # 13. FINALIZE SQLITE
      # ============================================================

      - name: Finalize SQLite
        if: always()
        run: |
          set -euo pipefail

          if [ -f "$ATLAS_SQLITE_FILE" ]; then

            echo "=================================================="
            echo "SQLITE FINALIZATION"
            echo "=================================================="

            python - <<'PY'
          import os
          import sqlite3
          import sys

          db = os.environ["ATLAS_SQLITE_FILE"]

          con = sqlite3.connect(
              db,
              timeout=30
          )

          try:

              con.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              )

              con.execute(
                  "PRAGMA optimize"
              )

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()

              status = (
                  result[0]
                  if result
                  else "UNKNOWN"
              )

              print(
                  "SQLite integrity:",
                  status
              )

              if status != "ok":
                  sys.exit(1)

          finally:

              con.close()

          PY

          else

            echo "SQLite database not created in this run."

          fi

      # ============================================================
      # 14. FINAL STATUS
      # ============================================================

      - name: Final status
        if: success()
        run: |
          echo "=================================================="
          echo "ATLAS AI v11.2 COMPLETED SUCCESSFULLY"
          echo "=================================================="
          echo "Version: 11.2"
          echo "Timeframe: 4H"
          echo "Engine: $ATLAS_ENGINE"
          echo "Run mode: $ATLAS_RUN_MODE"
          echo "Trade geometry: enabled"
          echo "Dynamic CSV: enabled"
          echo "Dashboard: enabled"
          echo "3H snapshot: enabled"
          echo "Telegram: configured"
          echo "=================================================="

name: ATLAS AI Test & Deploy

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov pytest-timeout pytest-mock flake8 mypy
    
    - name: Lint with flake8
      run: |
        flake8 bot.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 bot.py --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics
    
    - name: Check with mypy
      run: |
        mypy bot.py --ignore-missing-imports --no-strict-optional || true
    
    - name: Run smoke tests
      run: |
        if [ -f test_smoke.py ]; then python test_smoke.py; fi
    
    - name: Run unit tests with coverage
      run: |
        if [ -f test_bot.py ]; then pytest test_bot.py -v --cov=bot --cov-report=xml --cov-report=html --timeout=60; fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Create .env file
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        echo "TELEGRAM_GROUP_CHAT_ID=${{ secrets.TELEGRAM_GROUP_CHAT_ID }}" >> .env
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
        echo "COINGECKO_API_KEY=${{ secrets.COINGECKO_API_KEY }}" >> .env
        echo "COINGLASS_API_KEY=${{ secrets.COINGLASS_API_KEY }}" >> .env
        echo "NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}" >> .env
        echo "CRYPTOPANIC_TOKEN=${{ secrets.CRYPTOPANIC_TOKEN }}" >> .env
        echo "ATLAS_ENABLE_VOICE=1" >> .env
        echo "ATLAS_AUTO_SEND_VOICE=1" >> .env
        echo "ATLAS_VOICE_TYPE=female" >> .env
        echo "ATLAS_ENABLE_IMAGE_TABLE=1" >> .env
        echo "ATLAS_RUN_MODE=AUTO" >> .env
        echo "ATLAS_ENGINE=BOTH" >> .env
        
        # نمایش محتوای فایل برای دیباگ
        cat .env
    
    - name: Set environment variables directly
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
        ATLAS_ENABLE_VOICE: 1
        ATLAS_AUTO_SEND_VOICE: 1
        ATLAS_VOICE_TYPE: female
        ATLAS_ENABLE_IMAGE_TABLE: 1
        ATLAS_RUN_MODE: AUTO
        ATLAS_ENGINE: BOTH
      run: |
        echo "🚀 Starting ATLAS AI with environment variables..."
        echo "ATLAS_ENABLE_IMAGE_TABLE=${ATLAS_ENABLE_IMAGE_TABLE}"
        echo "ATLAS_ENGINE=${ATLAS_ENGINE}"
        echo "ATLAS_RUN_MODE=${ATLAS_RUN_MODE}"
        
        # اجرای مستقیم با متغیرهای محیطی
        python bot.py &
        sleep 30
        echo "✅ ATLAS AI started successfully"
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          changelog.txt
          atlas_*.sqlite3
          *.log
          .env
        retention-days: 7

  test-report:
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check test status
      id: status
      run: |
        if [ "${{ needs.test.result }}" = "success" ]; then
          echo "status=✅ All tests passed!" >> $GITHUB_OUTPUT
        else
          echo "status=❌ Some tests failed!" >> $GITHUB_OUTPUT
        fi
    
    - name: Print status
      run: |
        echo "::notice::${{ steps.status.outputs.status }}"

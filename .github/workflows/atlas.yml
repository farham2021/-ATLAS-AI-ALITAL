name: ATLAS AI Two Engine
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "MARKET, PERSONAL or BOTH"
        required: false
        default: PERSONAL
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "30 18 * * *"
jobs:
  atlas:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      ATLAS_ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.engine || 'PERSONAL' }}
      ATLAS_TIMEFRAME: "4H"
      ATLAS_MIN_CONFIDENCE: "60"
      ATLAS_MIN_EXECUTABLE_RR: "2.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile
        run: |
          set -euo pipefail
          test -f bot.py
          test -f smoke_atlas.py
          python -m py_compile bot.py
          python -m py_compile smoke_atlas.py
      - name: Smoke
        run: python smoke_atlas.py
      - name: Run ATLAS
        run: python bot.py

name: ATLAS v11.2 CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1
  ATLAS_VERSION: 11.2
  ATLAS_ENGINE: BOTH
  ATLAS_RUN_MODE: BOTH
  ATLAS_TIMEFRAME: 4H
  ATLAS_TRADINGVIEW_EXCHANGE: BYBIT
  ATLAS_TRADINGVIEW_INTERVAL: 240
  ATLAS_TRADE_GEOMETRY_EPSILON: 1e-12
  ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: 0.05
  ATLAS_SQLITE_FILE: atlas_v11_2.sqlite3
  ATLAS_CHANGELOG: changelog_v11_2.txt
  ATLAS_ENABLE_VOICE: true
  ATLAS_VOICE_TYPE: female
  ATLAS_VOICE_LANGUAGE: fa
  ATLAS_AUTO_SEND_VOICE: 1
  ATLAS_MAX_WORKERS: 5
  ATLAS_CACHE_TTL: 300
  ATLAS_REQUEST_SLEEP_SECONDS: 0.50
  ATLAS_MIN_VOLUME_RATIO: 1.20
  ATLAS_SIGNAL_MEMORY_HOURS: 4
  ATLAS_MIN_CONFIDENCE: 60
  ATLAS_MIN_WATCH_CONFIDENCE: 55
  ATLAS_MIN_EXECUTABLE_RR: 2.0
  RISK_PER_TRADE_PCT: 1.5
  MAX_PORTFOLIO_OPEN_RISK_PCT: 6.0
  ATLAS_MAX_LEVERAGE: 10
  ATLAS_BACKTEST_DAYS: 180
  ATLAS_SIGNAL_HORIZON_BARS: 36
  ATLAS_BACKTEST_IMPROVEMENT: 10
  ATLAS_BACKTEST_REFRESH_HOURS: 24
  ATLAS_CANDLE_EVENT_DEDUP: 1
  ATLAS_BTC_REGIME_CACHE_MINUTES: 30
  ATLAS_MARKET_BREADTH_MIN_SAMPLES: 8
  ATLAS_H4_FALLBACK_MIN_SCORE: 70

jobs:
  test:
    name: Test ATLAS v11.2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install ccxt pandas numpy gTTS edge-tts
          pip install flake8 pytest pytest-cov
          pip list

      - name: Check syntax
        run: |
          python -m py_compile bot.py
          python -c "import bot; print(f'✅ Bot loaded: {bot.VERSION}')"

      - name: Run linter
        run: |
          flake8 bot.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run smoke test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          SMOKE_TEST_SEND: false
        run: |
          python smoke_atlas.py

      - name: Run unit tests
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pytest test_atlas.py -v --tb=short || python test_atlas.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            *.log
            *.sqlite3
            *.csv
          retention-days: 7

  run:
    name: Run ATLAS v11.2
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install ccxt pandas numpy gTTS edge-tts

      - name: Run ATLAS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ATLAS_RUN_MODE: ANALYSIS
        run: |
          python bot.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-output
          path: |
            *.sqlite3
            *.csv
            *.log
            *.txt
          retention-days: 7

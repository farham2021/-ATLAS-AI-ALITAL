name: ATLAS v11.2 — Unified Two-Engine + Reliable Delivery

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "MARKET / PERSONAL / BOTH"
        required: false
        default: "BOTH"

      run_mode:
        description: "AUTO / BOTH / ANALYSIS / SNAPSHOT"
        required: false
        default: "AUTO"

  schedule:
    # Hourly scheduler.
    # The engine itself determines whether analytical
    # and/or snapshot processing is required.
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v11-2-${{ github.ref }}
  cancel-in-progress: false

jobs:

  atlas-v11-2:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      # ============================================================
      # CORE
      # ============================================================

      PYTHONUNBUFFERED: "1"

      ATLAS_VERSION: "11.2"

      ATLAS_ENGINE: ${{ github.event.inputs.engine || 'BOTH' }}

      ATLAS_RUN_MODE: ${{ github.event.inputs.run_mode || 'AUTO' }}

      ATLAS_TIMEFRAME: "4H"

      # ============================================================
      # MARKET / TRADINGVIEW
      # ============================================================

      ATLAS_TRADINGVIEW_EXCHANGE: "BYBIT"

      ATLAS_TRADINGVIEW_INTERVAL: "240"

      # ============================================================
      # TRADE GEOMETRY
      # ============================================================

      ATLAS_TRADE_GEOMETRY_EPSILON: "1e-12"

      ATLAS_SNAPSHOT_FLAT_THRESHOLD_PCT: "0.05"

      # ============================================================
      # RISK MANAGEMENT
      # ============================================================

      RISK_PER_TRADE_PCT: "1.5"

      MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"

      ATLAS_MIN_CONFIDENCE: "60"

      ATLAS_MAX_LEVERAGE: "10"

      ATLAS_MIN_EXECUTABLE_RR: "2.0"

      ATLAS_MIN_WATCH_CONFIDENCE: "55"

      # ============================================================
      # BACKTEST / SIGNAL
      # ============================================================

      ATLAS_BACKTEST_DAYS: "180"

      ATLAS_SIGNAL_HORIZON_BARS: "36"

      ATLAS_BACKTEST_IMPROVEMENT: "10"

      ATLAS_BACKTEST_REFRESH_HOURS: "24"

      ATLAS_CANDLE_EVENT_DEDUP: "1"

      # ============================================================
      # STORAGE
      # ============================================================

      ATLAS_SQLITE_FILE: "atlas_v11_2.sqlite3"

      ATLAS_CHANGELOG: "changelog_v11_2.txt"

      # ============================================================
      # TELEGRAM RELIABLE DELIVERY
      # ============================================================

      TELEGRAM_PRIVATE_DELAY: "1.5"

      TELEGRAM_GROUP_DELAY: "3.0"

      TELEGRAM_MAX_RETRIES: "5"

      TELEGRAM_BASE_RETRY_DELAY: "3"

      TELEGRAM_MAX_WAIT: "60"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ============================================================
      # SUPABASE
      # ============================================================

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ============================================================
      # MARKET DATA
      # ============================================================

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

      # ============================================================
      # NEWS
      # ============================================================

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}

      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      # ============================================================
      # OTHER OPTIONAL SOURCES
      # ============================================================

      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      TRADINGVIEW_CONFIRMATION_URL: ${{ secrets.TRADINGVIEW_CONFIRMATION_URL }}


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v5


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.12

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f "requirements-v11.2.txt" ]; then

            echo "Installing requirements-v11.2.txt"

            python -m pip install -r requirements-v11.2.txt

          elif [ -f "requirements.txt" ]; then

            echo "Installing requirements.txt"

            python -m pip install -r requirements.txt

          else

            echo "No requirements file found."

            echo "Installing minimum runtime dependency."

            python -m pip install "ccxt>=4.5.0" requests

          fi

          echo "Dependencies installed successfully."


      # ============================================================
      # 4. PROJECT STRUCTURE
      # ============================================================

      - name: Validate project structure

        run: |

          set -euo pipefail

          echo "=================================================="

          echo "PROJECT STRUCTURE"

          echo "=================================================="

          required_files=(

            "bot.py"

            "smoke_atlas.py"

            "test_v11_2.py"

          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$file" ]; then

              echo "ERROR: Missing required file: $file"

              exit 1

            fi

            echo "PASS: $file"

          done

          echo "Project structure validation PASSED."


      # ============================================================
      # 5. LEGACY ENGINE CHECK
      #
      # IMPORTANT:
      # Do NOT grep smoke_atlas.py for historical explanatory
      # strings. The previous workflow incorrectly failed because
      # harmless comments/test messages contained old references.
      # ============================================================

      - name: Validate active imports

        run: |

          set -euo pipefail

          echo "=================================================="

          echo "ACTIVE IMPORT CHECK"

          echo "=================================================="

          python - <<'PY'

          from pathlib import Path

          files = [

              Path("bot.py"),

              Path("smoke_atlas.py"),

              Path("test_v11_2.py"),

          ]

          forbidden = [

              "import bot as engine",

              "from bot import",

          ]

          for path in files:

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for pattern in forbidden:

                  if pattern in source:

                      print(
                          f"ERROR: Active obsolete import found "
                          f"in {path}: {pattern}"
                      )

                      raise SystemExit(1)

              print(f"PASS: {path}")

          print("Active import validation PASSED.")

          PY


      # ============================================================
      # 6. PYTHON SYNTAX
      # ============================================================

      - name: Validate Python syntax

        run: |

          set -euo pipefail

          python -m py_compile bot.py

          python -m py_compile smoke_atlas.py

          python -m py_compile test_v11_2.py

          echo "Python syntax validation PASSED."


      # ============================================================
      # 7. SMOKE TEST
      # ============================================================

      - name: Run v11.2 smoke test

        run: |

          set -euo pipefail

          python smoke_atlas.py


      # ============================================================
      # 8. V11.2 TEST SUITE
      # ============================================================

      - name: Run v11.2 tests

        run: |

          set -euo pipefail

          python test_v11_2.py


      # ============================================================
      # 9. TELEGRAM CONFIGURATION
      # ============================================================

      - name: Validate Telegram configuration

        run: |

          set -euo pipefail

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then

            echo "ERROR: TELEGRAM_TOKEN is missing."

            exit 1

          fi


          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && \
             [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then

            echo "ERROR: No Telegram destination configured."

            echo "Configure TELEGRAM_CHAT_ID and/or TELEGRAM_GROUP_CHAT_ID."

            exit 1

          fi


          echo "Telegram configuration detected."

          echo "Private destination: configured"

          echo "Group destination: configured"


      # ============================================================
      # 10. TELEGRAM PREFLIGHT
      # ============================================================

      - name: Telegram preflight

        run: |

          set -euo pipefail

          python - <<'PY'

          import json
          import os
          import urllib.request


          token = os.environ.get(
              "TELEGRAM_TOKEN",
              ""
          ).strip()


          if not token:

              raise SystemExit(
                  "TELEGRAM_TOKEN is empty."
              )


          url = (
              "https://api.telegram.org/"
              f"bot{token}/getMe"
          )


          request = urllib.request.Request(

              url,

              headers={
                  "User-Agent": "ATLAS-AI-v11.2"
              }

          )


          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              payload = json.loads(
                  response.read().decode("utf-8")
              )


          if not payload.get("ok"):

              raise SystemExit(
                  "Telegram getMe failed: "
                  + str(payload)
              )


          bot = payload.get(
              "result",
              {}
          )


          print(
              "Telegram bot OK:",
              bot.get(
                  "username",
                  "unknown"
              )
          )

          PY


      # ============================================================
      # 11. TELEGRAM DESTINATION TEST
      # ============================================================

      - name: Validate Telegram destinations

        run: |

          set -euo pipefail

          python - <<'PY'

          import os
          import json
          import urllib.request
          import urllib.parse


          token = os.environ["TELEGRAM_TOKEN"]


          destinations = []


          private_id = os.environ.get(
              "TELEGRAM_CHAT_ID",
              ""
          ).strip()


          group_id = os.environ.get(
              "TELEGRAM_GROUP_CHAT_ID",
              ""
          ).strip()


          if private_id:

              destinations.append(
                  ("PRIVATE", private_id)
              )


          if group_id:

              destinations.append(
                  ("GROUP", group_id)
              )


          if not destinations:

              raise SystemExit(
                  "No Telegram destinations configured."
              )


          for label, chat_id in destinations:

              payload = urllib.parse.urlencode({

                  "chat_id": chat_id,

                  "text":
                      "ATLAS v11.2 Telegram preflight OK."

              }).encode()


              url = (
                  "https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )


              request = urllib.request.Request(

                  url,

                  data=payload,

                  method="POST",

                  headers={
                      "Content-Type":
                      "application/x-www-form-urlencoded",

                      "User-Agent":
                      "ATLAS-AI-v11.2"
                  }

              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )


                  if not result.get("ok"):

                      raise RuntimeError(
                          str(result)
                      )


                  print(
                      f"PASS: Telegram {label} "
                      f"destination accepted."
                  )


              except Exception as exc:

                  raise SystemExit(
                      f"ERROR: Telegram {label} "
                      f"destination failed: {exc}"
                  )

          PY


      # ============================================================
      # 12. RUN ATLAS v11.2
      # ============================================================

      - name: Run ATLAS AI v11.2

        run: |

          set -euo pipefail

          python bot.py


      # ============================================================
      # 13. VERIFY OUTPUT DATABASE
      # ============================================================

      - name: Verify SQLite

        if: always()

        run: |

          set -euo pipefail

          if [ -f "$ATLAS_SQLITE_FILE" ]; then

            python - <<'PY'

          import os
          import sqlite3


          db = os.environ["ATLAS_SQLITE_FILE"]


          con = sqlite3.connect(
              db,
              timeout=30
          )


          try:

              con.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              )

              con.execute(
                  "PRAGMA optimize"
              )

              result = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()


              status = (
                  result[0]
                  if result
                  else "UNKNOWN"
              )


              print(
                  "SQLite integrity:",
                  status
              )


              if status != "ok":

                  raise SystemExit(1)


          finally:

              con.close()

          PY

          else

            echo "SQLite file not created in this run."

          fi


      # ============================================================
      # 14. FINAL STATUS
      # ============================================================

      - name: Final status

        if: success()

        run: |

          echo "=================================================="

          echo "ATLAS AI v11.2 COMPLETED SUCCESSFULLY"

          echo "=================================================="

          echo "Engine: Unified Two-Engine"

          echo "Timeframe: 4H"

          echo "Telegram delivery: verified"

          echo "Market analysis: completed"

          echo "Personal portfolio analysis: completed"

          echo "Snapshot engine: enabled"

          echo "Trade geometry: enabled"

          echo "Risk controls: enabled"

          echo "=================================================="

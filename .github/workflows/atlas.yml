name: ATLAS AI v10.2 — Two Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "MARKET, PERSONAL or BOTH"
        required: true
        default: "BOTH"
        type: choice
        options:
          - MARKET
          - PERSONAL
          - BOTH
  schedule:
    # Tehran UTC+03:30.
    # MARKET: 08:00 / 14:00 / 20:00 Tehran
    - cron: "30 4,10,16 * * *"
    # PERSONAL: 08:30 and 23:00 Tehran
    - cron: "0 5 * * *"
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-two-engine-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  ATLAS_VERSION: "10.2"
  ATLAS_TIMEFRAME: "4H"
  RISK_PER_TRADE_PCT: "1.5"
  MAX_PORTFOLIO_OPEN_RISK_PCT: "6.0"
  ATLAS_MIN_CONFIDENCE: "60"
  ATLAS_MAX_LEVERAGE: "10"
  ATLAS_BACKTEST_DAYS: "180"
  ATLAS_SIGNAL_HORIZON_BARS: "36"
  ATLAS_BACKTEST_IMPROVEMENT: "10"
  ATLAS_BACKTEST_REFRESH_HOURS: "24"
  ATLAS_MIN_VOLUME_RATIO: "0.80"
  ATLAS_H4_FALLBACK_MIN_SCORE: "70"
  ATLAS_REQUEST_SLEEP_SECONDS: "0.50"
  ATLAS_CANDLE_EVENT_DEDUP: "1"
  ATLAS_MIN_EXECUTABLE_RR: "2.0"
  ATLAS_MIN_WATCH_CONFIDENCE: "55"
  ATLAS_BTC_REGIME_CACHE_MINUTES: "30"
  ATLAS_SIGNAL_MEMORY_HOURS: "12"
  ATLAS_MARKET_BREADTH_MIN_SAMPLES: "8"
  ATLAS_SQLITE_FILE: "atlas_v102.sqlite3"
  ATLAS_CHANGELOG: "changelog.txt"

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATLAS_ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 5 * * *' && 'PERSONAL') || (github.event.schedule == '30 19 * * *' && 'PERSONAL') || 'MARKET' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade ccxt

      - name: Validate repository
        run: |
          set -euo pipefail
          test -f bot.py
          test -f smoke_atlas.py
          python -m py_compile bot.py
          python -m py_compile smoke_atlas.py
          python smoke_atlas.py

      - name: Validate Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID" || test -n "$TELEGRAM_GROUP_CHAT_ID"

      - name: Show selected engine
        run: |
          echo "ATLAS_ENGINE=$ATLAS_ENGINE"

      - name: Run ATLAS
        run: |
          set -euo pipefail
          python bot.py

      - name: Finalize SQLite
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$ATLAS_SQLITE_FILE" ]; then
            python - <<'PY'
          import os, sqlite3
          db=os.environ.get("ATLAS_SQLITE_FILE","atlas_v102.sqlite3")
          con=sqlite3.connect(db,timeout=30)
          try:
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              con.execute("PRAGMA integrity_check").fetchone()
              con.commit()
          finally:
              con.close()
          print("SQLite finalize: OK")
          PY
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-two-engine-${{ github.run_id }}
          path: |
            atlas_v102.sqlite3
            changelog.txt
          if-no-files-found: ignore
          retention-days: 14

name: ATLAS AI Test & Deploy

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout pytest-mock
    
    - name: Lint with flake8
      run: |
        flake8 bot.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bot.py --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics
    
    - name: Check with mypy
      run: |
        mypy bot.py --ignore-missing-imports --no-strict-optional || true
    
    - name: Run smoke tests
      run: |
        python test_smoke.py
    
    - name: Run unit tests with coverage
      run: |
        pytest test_bot.py -v --cov=bot --cov-report=xml --cov-report=html --timeout=60
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Deploy to production
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
        ATLAS_ENABLE_VOICE: ${{ vars.ATLAS_ENABLE_VOICE || '1' }}
        ATLAS_AUTO_SEND_VOICE: ${{ vars.ATLAS_AUTO_SEND_VOICE || '1' }}
        ATLAS_VOICE_TYPE: ${{ vars.ATLAS_VOICE_TYPE || 'female' }}
        ATLAS_ENABLE_IMAGE_TABLE: ${{ vars.ATLAS_ENABLE_IMAGE_TABLE || '1' }}
        ATLAS_RUN_MODE: ${{ vars.ATLAS_RUN_MODE || 'AUTO' }}
        ATLAS_ENGINE: ${{ vars.ATLAS_ENGINE || 'BOTH' }}
      run: |
        echo "🚀 Starting ATLAS AI..."
        python bot.py
    
    - name: Upload artifact on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          changelog.txt
          atlas_*.sqlite3
          *.log
        retention-days: 7

  test-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Test Report
      uses: actions/github-script@v7
      with:
        script: |
          const result = ${{ needs.test.result }}
          if (result === 'success') {
            core.setOutput('status', '✅ All tests passed!')
          } else {
            core.setOutput('status', '❌ Some tests failed!')
          }
      id: status
    
    - name: Print status
      run: |
        echo "::notice::${{ steps.status.outputs.status }}"

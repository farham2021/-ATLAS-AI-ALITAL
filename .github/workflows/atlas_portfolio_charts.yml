name: ATLAS Private Portfolio Charts
on:
  workflow_dispatch:
  schedule:
    - cron: "20 15 * * *"
permissions:
  contents: read
concurrency:
  group: atlas-private-portfolio
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install chart renderer
        run: python -m pip install "matplotlib>=3.8,<4"
      - name: Send private holdings charts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ATLAS_PORTFOLIO_USER_ID: ${{ secrets.ATLAS_PORTFOLIO_USER_ID }}
          ATLAS_PORTFOLIO_CHAT_ID: ${{ secrets.ATLAS_PORTFOLIO_CHAT_ID }}
        run: python atlas_portfolio_charts.py

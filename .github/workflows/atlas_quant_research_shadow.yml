name: ATLAS Quant Research Shadow Gate
on:
  workflow_dispatch:
  push:
    paths:
      - atlas_six_strategies_shadow.py
      - test_atlas_six_strategies_shadow.py
      - atlas_trade_replay_shadow.py
      - test_atlas_trade_replay_shadow.py
      - atlas_kronos_adapter_shadow.py
      - test_atlas_kronos_adapter_shadow.py
      - atlas_portfolio_risk_shield.py
      - test_atlas_portfolio_risk_shield.py
      - atlas_external_evidence_gate.py
      - test_atlas_external_evidence_gate.py
      - atlas_quant_research_gate.py
      - test_atlas_quant_research_gate.py
      - .github/workflows/atlas_quant_research_shadow.yml
permissions:
  contents: read
jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test research gate without secrets or network
        run: python -m unittest -v test_atlas_six_strategies_shadow test_atlas_quant_research_gate test_atlas_portfolio_risk_shield test_atlas_trade_replay_shadow test_atlas_kronos_adapter_shadow test_atlas_external_evidence_gate

name: ATLAS AI Two Engine
on:
  workflow_dispatch:
    inputs:
      engine:
        required: true
        default: MARKET
        type: choice
        options: [MARKET, PERSONAL, BOTH]
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"
    - cron: "30 19 * * *"
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Select engine
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ATLAS_ENGINE=${{ inputs.engine }}" >> "$GITHUB_ENV"
          else
            case "$(date -u +%H:%M)" in
              05:00|19:30) echo "ATLAS_ENGINE=PERSONAL" >> "$GITHUB_ENV" ;;
              08:30|12:30|16:30) echo "ATLAS_ENGINE=MARKET" >> "$GITHUB_ENV" ;;
              *) echo "ATLAS_ENGINE=MARKET" >> "$GITHUB_ENV" ;;
            esac
          fi
      - name: Validate
        run: |
          set -euo pipefail
          python -m py_compile ATLAS_bot_two_engine.py
          python smoke_atlas_two_engine.py
      - name: Run
        env:
          ATLAS_ENGINE: ${{ env.ATLAS_ENGINE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ATLAS_bot_two_engine.py

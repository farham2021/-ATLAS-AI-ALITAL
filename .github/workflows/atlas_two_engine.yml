name: ATLAS AI

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "ATLAS engine"
        required: false
        default: "MARKET"
        type: choice
        options:
          - MARKET
          - PERSONAL
          - BOTH

  schedule:
    # 08:30 Tehran
    - cron: "0 5 * * *"

    # 12:00 Tehran
    - cron: "30 8 * * *"

    # 16:00 Tehran
    - cron: "30 12 * * *"

    # 20:00 Tehran
    - cron: "30 16 * * *"

    # 23:00 Tehran
    - cron: "30 19 * * *"

jobs:
  atlas:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      ATLAS_VERSION: "10.2"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi


      # ============================================================
      # 4. SELECT ATLAS ENGINE
      # ============================================================

      - name: Select ATLAS engine
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "ATLAS_ENGINE=${{ inputs.engine }}" >> "$GITHUB_ENV"

          else

            CURRENT_TIME="$(date -u +%H:%M)"

            case "$CURRENT_TIME" in

              # 08:30 Tehran
              05:00)
                echo "ATLAS_ENGINE=PERSONAL" >> "$GITHUB_ENV"
                ;;

              # 12:00 / 16:00 / 20:00 Tehran
              08:30|12:30|16:30)
                echo "ATLAS_ENGINE=MARKET" >> "$GITHUB_ENV"
                ;;

              # 23:00 Tehran
              19:30)
                echo "ATLAS_ENGINE=PERSONAL" >> "$GITHUB_ENV"
                ;;

              *)
                echo "ATLAS_ENGINE=MARKET" >> "$GITHUB_ENV"
                ;;

            esac

          fi


      # ============================================================
      # 5. SHOW FILES
      # ============================================================

      - name: Check repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ATLAS REPOSITORY"
          echo "=============================================="

          ls -la

          echo ""
          echo "Python files:"

          ls -la *.py 2>/dev/null || true


      # ============================================================
      # 6. VALIDATE BOT
      # ============================================================

      - name: Validate ATLAS
        shell: bash
        run: |
          set -euo pipefail

          test -f bot.py
          test -f smoke_atlas.py

          echo "bot.py found"
          echo "smoke_atlas.py found"

          python -m py_compile bot.py

          echo "Python compilation: PASS"


      # ============================================================
      # 7. SMOKE TEST
      # ============================================================

      - name: Run ATLAS smoke test
        shell: bash
        run: |
          set -euo pipefail

          python smoke_atlas.py


      # ============================================================
      # 8. RUN ATLAS
      # ============================================================

      - name: Run ATLAS AI
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ATLAS AI"
          echo "=============================================="

          echo "Engine: ${ATLAS_ENGINE}"
          echo "Version: ${ATLAS_VERSION}"

          echo ""

          python bot.py

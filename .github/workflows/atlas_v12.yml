name: ATLAS AI v12

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  validate-v12:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-v12.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v12.txt

      - name: Verify required files
        run: |
          set -euo pipefail

          required_files=(
            "bot12.py"
            "atlas_v12_upgrade.py"
            "smoke_atlas.py"
            "test_v12.py"
            "requirements-v12.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Python syntax validation
        run: |
          set -euo pipefail

          python -m py_compile \
            bot12.py \
            atlas_v12_upgrade.py \
            smoke_atlas.py \
            test_v12.py

      - name: Verify smoke test shebang
        run: |
          set -euo pipefail

          first_line="$(head -n 1 smoke_atlas.py)"

          if [ "$first_line" != "#!/usr/bin/env python3" ]; then
            echo "ERROR: smoke_atlas.py must start with:"
            echo "#!/usr/bin/env python3"
            exit 1
          fi

          echo "OK: smoke_atlas.py shebang"

      - name: Run v12 test suite
        run: |
          set -euo pipefail
          python test_v12.py

      - name: Run smoke test
        run: |
          set -euo pipefail
          python smoke_atlas.py

name: ATLAS AI v12 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate ATLAS AI v12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v12.txt

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README_v12.md"
            "atlas_v12_upgrade.py"
            "bot12.py"
            "requirements-v12.txt"
            "smoke_atlas.py"
            "test_v12.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          if [[ ! -f ".github/workflows/atlas_v12.yml" ]]; then
            echo "ERROR: Workflow file not found."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements-v12.txt

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile atlas_v12_upgrade.py
          python -m py_compile bot12.py
          python -m py_compile smoke_atlas.py
          python -m py_compile test_v12.py

          echo "Python syntax validation passed."

      - name: Check smoke test executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x smoke_atlas.py

          first_line="$(head -n 1 smoke_atlas.py)"

          if [[ "$first_line" != "#!/usr/bin/env python3" ]]; then
            echo "ERROR: smoke_atlas.py must start with:"
            echo "#!/usr/bin/env python3"
            echo "Actual first line:"
            echo "$first_line"
            exit 1
          fi

          echo "Smoke test shebang is valid."

      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail

          ./smoke_atlas.py

      - name: Run v12 tests
        shell: bash
        run: |
          set -euo pipefail

          python test_v12.py

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ATLAS AI v12 CI PASSED"
          echo "=========================================="
          echo "Python: $(python --version)"
          echo "Pip:    $(python -m pip --version)"
          echo "Status: ALL CHECKS PASSED"

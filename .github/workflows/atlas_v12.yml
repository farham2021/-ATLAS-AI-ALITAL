name: ATLAS AI v12 - Reliable Analytical Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-v12
  cancel-in-progress: false

jobs:
  atlas-v12:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

      ATLAS_VERSION: "12.0"
      ATLAS_TIMEFRAME: "4H"

      # ============================================================
      # V12 SETUP ENGINE
      # ============================================================

      ATLAS_V12_MIN_EXECUTABLE_RR: "1.50"
      ATLAS_V12_MIN_WATCH_RR: "1.00"

      ATLAS_V12_MIN_EXECUTABLE_CONFIDENCE: "65"
      ATLAS_V12_MIN_WATCH_CONFIDENCE: "50"

      ATLAS_V12_VOLUME_SPIKE: "2.50"

      # ============================================================
      # TGJU
      # USD and USDT must come ONLY from TGJU
      # ============================================================

      TGJU_USD_URL: "https://www.tgju.org/profile/price_dollar_rl"
      TGJU_USDT_URL: "https://www.tgju.org/profile/price_dollar_usdt"

      # ============================================================
      # TELEGRAM
      # ============================================================

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}

      # ============================================================
      # OPTIONAL MARKET DATA
      # ============================================================

      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements-v12.txt ]; then
            python -m pip install -r requirements-v12.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pandas numpy
          fi

      # ============================================================
      # 4. CHECK REQUIRED FILES
      # ============================================================

      - name: Validate project structure
        run: |
          set -euo pipefail

          required_files=(
            "bot12.py"
            "atlas_v12_upgrade.py"
            "telegram_delivery_v12.py"
            "smoke_atlas.py"
            "test_v12.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      # ============================================================
      # 5. PYTHON SYNTAX
      # ============================================================

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          python -m py_compile bot12.py
          python -m py_compile atlas_v12_upgrade.py
          python -m py_compile telegram_delivery_v12.py
          python -m py_compile smoke_atlas.py
          python -m py_compile test_v12.py

          echo "Python syntax validation PASSED."

      # ============================================================
      # 6. SMOKE TEST
      # ============================================================

      - name: Run smoke test
        run: |
          set -euo pipefail

          python smoke_atlas.py

      # ============================================================
      # 7. V12 TEST SUITE
      # ============================================================

      - name: Run v12 tests
        run: |
          set -euo pipefail

          python test_v12.py

      # ============================================================
      # 8. TELEGRAM CONFIGURATION
      # ============================================================

      - name: Validate Telegram configuration
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && \
             [ -z "${TELEGRAM_GROUP_CHAT_ID:-}" ]; then
            echo "ERROR: No Telegram destination configured."
            echo "Set TELEGRAM_CHAT_ID and/or TELEGRAM_GROUP_CHAT_ID."
            exit 1
          fi

          echo "Telegram configuration detected."

      # ============================================================
      # 9. TELEGRAM PREFLIGHT
      # ============================================================

      - name: Telegram preflight
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import urllib.request
          import json

          token = os.environ["TELEGRAM_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not data.get("ok"):
              raise SystemExit(
                  "Telegram getMe failed: "
                  + str(data)
              )

          bot = data.get("result", {})

          print(
              "Telegram bot OK:",
              bot.get("username", "unknown")
          )
          PY

      # ============================================================
      # 10. RUN ATLAS V12
      # ============================================================

      - name: Run ATLAS AI v12
        run: |
          set -euo pipefail

          python bot12.py

      # ============================================================
      # 11. FINAL STATUS
      # ============================================================

      - name: Final status
        if: success()
        run: |
          echo "=================================================="
          echo "ATLAS AI v12 COMPLETED SUCCESSFULLY"
          echo "=================================================="
          echo "Telegram delivery completed."
          echo "TGJU USD/USDT source configured."
          echo "4H engine completed."

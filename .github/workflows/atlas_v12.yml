name: ATLAS AI v12

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-v12:
    name: ATLAS v12 Validation
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------
      # 3. Verify repository structure
      # --------------------------------------------------
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README_v12.md"
            "ATLAS_v12_bot.py"
            "atlas_v12_upgrade.py"
            "requirements-v12.txt"
            "smoke_atlas.py"
            "test_v12.py"
          )

          echo "Checking required ATLAS v12 files..."

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "Repository structure validation passed."

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f "requirements-v12.txt" ]]; then
            python -m pip install -r requirements-v12.txt
          else
            echo "ERROR: requirements-v12.txt not found."
            exit 1
          fi

      # --------------------------------------------------
      # 5. Validate Python syntax
      # --------------------------------------------------
      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile ATLAS_v12_bot.py
          python -m py_compile atlas_v12_upgrade.py
          python -m py_compile smoke_atlas.py
          python -m py_compile test_v12.py

          echo "Python syntax validation passed."

      # --------------------------------------------------
      # 6. Run v12 unit test
      # --------------------------------------------------
      - name: Run ATLAS v12 unit test
        shell: bash
        run: |
          set -euo pipefail

          python test_v12.py

      # --------------------------------------------------
      # 7. Run smoke test
      # --------------------------------------------------
      - name: Run ATLAS v12 smoke test
        shell: bash
        run: |
          set -euo pipefail

          python smoke_atlas.py

      # --------------------------------------------------
      # 8. Final validation
      # --------------------------------------------------
      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ATLAS AI v12 VALIDATION"
          echo "=========================================="
          echo "Python version:"
          python --version
          echo ""
          echo "Engine:"
          echo "ATLAS_v12_bot.py"
          echo ""
          echo "Unit test:"
          echo "PASS"
          echo ""
          echo "Smoke test:"
          echo "PASS"
          echo "=========================================="
          echo "ATLAS AI v12 validation completed."
          echo "=========================================="

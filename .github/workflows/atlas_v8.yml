name: ATLAS AI

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "ATLAS run mode"
        required: true
        default: "SIGNAL"
        type: choice
        options:
          - SIGNAL
          - PRECHECK
  schedule:
    # Tehran 11:30 / 15:30 / 21:30 — PRECHECK
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    # Tehran 12:00 / 16:00 / 22:00 — official SIGNAL
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"

jobs:
  run-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATLAS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade ccxt

      - name: Set scheduled run mode
        if: ${{ github.event_name == 'schedule' }}
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "0 8 * * *"|"0 12 * * *"|"0 18 * * *")
              echo "RUN_MODE=PRECHECK" >> "$GITHUB_ENV"
              ;;
            *)
              echo "RUN_MODE=SIGNAL" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Set manual run mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "RUN_MODE=${{ inputs.run_mode }}" >> "$GITHUB_ENV"

      - name: Run ATLAS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
          GOOGLE_SHEETS_SECRET: ${{ secrets.GOOGLE_SHEETS_SECRET }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          RISK_PER_TRADE_PCT: "0.75"
          MAX_PORTFOLIO_OPEN_RISK_PCT: "3.0"
        run: |
          python bot.py

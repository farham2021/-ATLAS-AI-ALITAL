name: Publish ATLAS Dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - atlas-dashboard.html
      - assets/**
      - docs/**
      - .github/workflows/publish-atlas-dashboard.yml
      - .github/workflows/atlas-web-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare combined static site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/desk
          cp atlas-dashboard.html _site/index.html
          cp atlas-dashboard.html _site/atlas-dashboard.html
          cp -a assets/. _site/assets/
          cp -a docs/. _site/desk/
          printf '%s\n' '<!doctype html><title>ATLAS</title><a href="./">ATLAS Dashboard</a>' > _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

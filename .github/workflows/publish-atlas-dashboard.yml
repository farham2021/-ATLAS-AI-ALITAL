name: ATLAS Dashboard Build Check (legacy publisher disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare combined static site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/desk
          cp atlas-dashboard.html _site/index.html
          cp atlas-dashboard.html _site/atlas-dashboard.html
          cp -a assets/. _site/assets/
          cp -a docs/. _site/desk/
          printf '%s\n' '<!doctype html><title>ATLAS</title><a href="./">ATLAS Dashboard</a>' > _site/404.html
      - name: Generate fail-closed Kalshi event snapshot
        run: python atlas_macro_events.py --output _site/macro_events.json
      - name: Generate fail-closed CoinGlass derivatives snapshot
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python atlas_coinglass_snapshot.py _site/coinglass_snapshot.json

      - name: Validate generated site
        run: test -s _site/index.html && test -s _site/desk/index.html

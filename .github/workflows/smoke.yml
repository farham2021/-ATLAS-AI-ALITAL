name: ATLAS AI Smoke Tests

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # --------------------------------------------------------
      # Checkout — Node 24 compatible
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # Python — Node 24 compatible action
      # --------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Smoke tests
      # --------------------------------------------------------
      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python test_smoke.py

      # --------------------------------------------------------
      # Quick integration / import test
      # --------------------------------------------------------
      - name: Run quick integration test
        timeout-minutes: 3
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import bot

          print(f"✅ Version: {bot.VERSION}")
          print(f"✅ Top 10: {bot.ATLAS_PRIORITY_TOP10[:5]}...")
          print(f"✅ Personal: {bot.ATLAS_PERSONAL_ASSETS[:5]}...")
          print("✅ Smoke test passed!")
          PY

      # --------------------------------------------------------
      # Required files
      # --------------------------------------------------------
      - name: Check for required files
        run: |
          set -euo pipefail

          test -f bot.py
          test -f test_smoke.py
          test -f requirements.txt

          echo "✅ All required files exist"

  notify:
    name: Smoke Test Result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # GitHub Script — Node 24 compatible
      # --------------------------------------------------------
      - name: Send notification
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ needs.smoke.result }}'
            const emoji = status === 'success' ? '✅' : '❌'
            console.log(`${emoji} Smoke tests ${status}`)

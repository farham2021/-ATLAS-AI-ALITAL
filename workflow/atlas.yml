name: ATLAS AI Test & Deploy

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install matplotlib edge-tts gtts
    - name: Create .env file
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        echo "TELEGRAM_GROUP_CHAT_ID=${{ secrets.TELEGRAM_GROUP_CHAT_ID }}" >> .env
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
        echo "COINGECKO_API_KEY=${{ secrets.COINGECKO_API_KEY }}" >> .env
        echo "COINGLASS_API_KEY=${{ secrets.COINGLASS_API_KEY }}" >> .env
        echo "NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}" >> .env
        echo "CRYPTOPANIC_TOKEN=${{ secrets.CRYPTOPANIC_TOKEN }}" >> .env
        echo "ATLAS_ENABLE_VOICE=1" >> .env
        echo "ATLAS_AUTO_SEND_VOICE=1" >> .env
        echo "ATLAS_VOICE_TYPE=female" >> .env
        echo "ATLAS_ENABLE_IMAGE_TABLE=1" >> .env
        echo "ATLAS_RUN_MODE=BOTH" >> .env
        echo "ATLAS_ENGINE=BOTH" >> .env
        echo "ATLAS_MIN_CONFIDENCE=55" >> .env
        echo "ATLAS_MIN_EXECUTABLE_RR=2.0" >> .env
        cat .env
    - name: Run ATLAS AI
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
        ATLAS_ENABLE_VOICE: 1
        ATLAS_AUTO_SEND_VOICE: 1
        ATLAS_VOICE_TYPE: female
        ATLAS_ENABLE_IMAGE_TABLE: 1
        ATLAS_RUN_MODE: BOTH
        ATLAS_ENGINE: BOTH
        ATLAS_MIN_CONFIDENCE: 55
        ATLAS_MIN_EXECUTABLE_RR: 2.0
      run: |
        echo "🚀 Starting ATLAS AI..."
        python bot.py
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          changelog.txt
          atlas_*.sqlite3
          *.log
          .env
          *.png
          *.mp3
        retention-days: 7

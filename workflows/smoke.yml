name: ATLAS AI Smoke Tests

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run smoke tests
      timeout-minutes: 5
      run: |
        python test_smoke.py
    
    - name: Run quick integration test
      timeout-minutes: 3
      env:
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      run: |
        python -c "
        import bot
        print(f'✅ Version: {bot.VERSION}')
        print(f'✅ Top 10: {bot.ATLAS_PRIORITY_TOP10[:5]}...')
        print(f'✅ Personal: {bot.ATLAS_PERSONAL_ASSETS[:5]}...')
        print('✅ Smoke test passed!')
        "
    
    - name: Check for required files
      run: |
        test -f bot.py || exit 1
        test -f test_smoke.py || exit 1
        test -f requirements.txt || exit 1
        echo "✅ All required files exist"

  notify:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send notification
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ needs.smoke.result }}'
          const emoji = status === 'success' ? '✅' : '❌'
          console.log(`${emoji} Smoke tests ${status}`)
